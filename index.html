            { question: "Salah satu cara mengatasi pengaruh buruk lingkungan dalam membaca adalah…", options: ["Membaca hanya pada malam hari agar lebih tenang", "Menciptakan suasana dan kondisi membaca yang kondusif dan nyaman", "Menghindari semua jenis bacaan yang sulit dipahami", "Membaca sambil mendengarkan musik keras agar lebih fokus"], correctAnswer: 1, explanation: "Mengatasi pengaruh buruk eksternal dalam membaca dilakukan antara lain dengan menciptakan suasana membaca yang kondusif, nyaman, dan bebas dari gangguan." },
            { question: "Pemahaman literal dalam membaca mengacu pada kemampuan pembaca untuk…", options: ["Membuat inferensi dan kesimpulan di luar isi teks", "Mengevaluasi kualitas dan keabsahan informasi bacaan", "Memahami informasi yang tersurat atau tertulis langsung dalam teks", "Menghubungkan isi teks dengan pengalaman pribadi pembaca"], correctAnswer: 2, explanation: "Pemahaman literal adalah tingkat pemahaman dasar di mana pembaca memahami informasi yang secara eksplisit atau tersurat dinyatakan dalam teks." },
            { question: "Pemahaman interpretatif dalam membaca menuntut pembaca untuk…", options: ["Membaca ulang teks sebanyak mungkin", "Menafsirkan makna tersirat dan membuat simpulan dari teks", "Menghafalkan fakta-fakta yang ada dalam bacaan", "Menulis kembali isi bacaan dengan kata-kata sendiri"], correctAnswer: 1, explanation: "Pemahaman interpretatif melibatkan kemampuan pembaca untuk menafsirkan makna yang tidak secara langsung dinyatakan, membuat inferensi, dan menarik kesimpulan dari teks." },
            { question: "Membaca intensif adalah kegiatan membaca yang dilakukan dengan…", options: ["Kecepatan tinggi untuk mendapatkan gambaran umum teks", "Tujuan memperoleh hiburan semata tanpa memperhatikan detail", "Cermat, teliti, dan mendalam untuk memahami isi bacaan secara menyeluruh", "Cara melompat-lompat pada bagian yang dianggap penting saja"], correctAnswer: 2, explanation: "Membaca intensif dilakukan secara cermat, teliti, dan mendalam dengan tujuan memahami isi bacaan secara menyeluruh, termasuk detail, fakta, dan konsep yang terkandung di dalamnya." },
            { question: "Strategi SQ3R dalam membaca intensif terdiri dari tahapan…", options: ["Survey, Question, Read, Recite, Review", "Scan, Query, Read, Record, Reflect", "Search, Question, Read, Respond, Review", "Survey, Query, Record, Recite, Reflect"], correctAnswer: 0, explanation: "SQ3R adalah strategi membaca intensif yang terdiri dari lima tahap: Survey (meninjau), Question (membuat pertanyaan), Read (membaca), Recite (mengulang), dan Review (meninjau kembali)." },
            { question: "Membaca ekstensif pada dasarnya merupakan kegiatan membaca yang dilakukan…", options: ["Secara mendalam dan terperinci pada satu teks tertentu", "Dalam jumlah banyak dan beragam untuk mendapatkan pemahaman umum", "Hanya pada teks-teks ilmiah yang memerlukan analisis mendalam", "Dengan kecepatan rendah untuk menjamin akurasi pemahaman"], correctAnswer: 1, explanation: "Membaca ekstensif dilakukan dalam jumlah bahan bacaan yang banyak dan beragam, dengan tujuan mendapatkan pemahaman umum tentang berbagai topik." },
            { question: "Salah satu strategi membaca ekstensif yang umum digunakan adalah membaca sekilas (skimming) yang bertujuan untuk…", options: ["Memahami setiap kata dan kalimat dalam teks secara mendalam", "Mendapatkan gambaran umum atau ide pokok suatu bacaan dengan cepat", "Menemukan informasi spesifik dalam teks dengan tepat", "Menganalisis struktur kalimat dalam sebuah paragraf"], correctAnswer: 1, explanation: "Skimming adalah teknik membaca cepat yang digunakan untuk mendapatkan gambaran umum atau menangkap ide pokok bacaan tanpa harus membaca setiap kata secara detail." },
            { question: "Kecepatan membaca efektif diukur berdasarkan…", options: ["Jumlah halaman yang mampu dibaca dalam satu hari", "Jumlah kata yang dibaca per menit dikombinasikan dengan tingkat pemahaman", "Kemampuan menghafalkan isi bacaan setelah selesai membaca", "Lama waktu yang dihabiskan untuk membaca satu buku"], correctAnswer: 1, explanation: "Kecepatan membaca efektif diukur dari jumlah kata per menit (KPM) yang dikombinasikan dengan persentase pemahaman terhadap isi bacaan tersebut." },
            { question: "Salah satu latihan untuk meningkatkan kecepatan membaca adalah…", options: ["Membaca teks yang sama berulang-ulang hingga hafal", "Mengurangi kebiasaan vokalisasi atau mengucapkan kata saat membaca dalam hati", "Membaca hanya pada satu jenis teks tertentu secara rutin", "Selalu menggunakan jari sebagai penunjuk setiap kali membaca"], correctAnswer: 1, explanation: "Vokalisasi (mengucapkan kata dalam hati atau bersuara) adalah hambatan kecepatan membaca. Menghilangkan kebiasaan ini merupakan salah satu latihan penting untuk meningkatkan kecepatan membaca." },
            { question: "Generasi milenial dalam konteks literasi digital dicirikan oleh…", options: ["Ketidakmampuan dalam menggunakan teknologi informasi", "Preferensi terhadap media cetak dibandingkan media digital", "Kemampuan adaptasi tinggi terhadap teknologi dan media digital", "Keengganan untuk berbagi informasi melalui platform digital"], correctAnswer: 2, explanation: "Generasi milenial dikenal dengan kemampuan adaptasi yang tinggi terhadap teknologi informasi dan media digital, sehingga perlu literasi digital yang baik untuk menyaring informasi secara kritis." },
            { question: "Etika dalam membaca di media daring (online) mencakup…", options: ["Menyebarkan ulang semua informasi yang ditemukan tanpa memverifikasi kebenarannya", "Memverifikasi sumber, menghargai hak cipta, dan tidak menyebarkan hoaks", "Mengakses konten berbayar secara ilegal untuk kemudahan membaca", "Mengutip karya orang lain tanpa mencantumkan sumber aslinya"], correctAnswer: 1, explanation: "Etika membaca di media daring meliputi verifikasi sumber informasi, menghargai hak cipta penulis, serta tidak menyebarkan berita palsu (hoaks) yang dapat merugikan banyak pihak." },
            { question: "Membaca teknis adalah jenis membaca yang bertujuan untuk…", options: ["Menikmati keindahan bahasa dan sastra dalam sebuah karya", "Memahami konten ilmiah, prosedural, atau teknis secara akurat", "Mendapatkan hiburan dari cerita fiksi dan imajinatif", "Memperoleh gambaran umum dari berbagai jenis teks"], correctAnswer: 1, explanation: "Membaca teknis bertujuan untuk memahami konten yang bersifat ilmiah, prosedural, atau teknis secara akurat, seperti membaca manual, laporan ilmiah, atau instruksi kerja." },
            { question: "Membaca estetis berbeda dari jenis membaca lainnya karena menekankan pada…", options: ["Kecepatan dalam menyelesaikan bacaan untuk efisiensi waktu", "Pemahaman fakta dan data secara objektif dari teks", "Penghayatan keindahan bahasa dan pengalaman emosional dari teks sastra", "Analisis struktur gramatikal kalimat dalam bacaan"], correctAnswer: 2, explanation: "Membaca estetis berfokus pada penghayatan keindahan bahasa, pengalaman estetik, dan respons emosional pembaca terhadap teks sastra, berbeda dari membaca yang semata-mata mengejar fakta atau informasi." }
          ],
          "Morfofonologi": [
            { question: "Fonologi sebagai cabang linguistik memiliki objek kajian utama yang membedakannya dari cabang linguistik lain. Apakah objek kajian utama fonologi?", options: ["Struktur kalimat dan hubungan antarkata", "Bunyi bahasa dan fungsinya dalam membedakan makna", "Pembentukan kata melalui afiksasi dan reduplikasi", "Hubungan antara tanda dan makna dalam bahasa"], correctAnswer: 1, explanation: "Fonologi mengkaji bunyi bahasa secara fungsional, yaitu bagaimana bunyi berperan dalam membedakan makna (distingtif). Ini membedakannya dari morfologi yang mengkaji pembentukan kata atau sintaksis yang mengkaji struktur kalimat." },
            { question: "Dalam hierarki linguistik, fonologi memiliki kedudukan yang penting sebagai dasar kajian kebahasaan. Manakah pernyataan yang paling tepat menggambarkan kedudukan fonologi?", options: ["Fonologi berdiri sendiri tanpa kaitan dengan cabang linguistik lain", "Fonologi hanya relevan untuk bahasa lisan, tidak untuk bahasa tulis", "Fonologi menjadi fondasi analisis morfologis, sintaktis, dan semantis", "Fonologi merupakan cabang linguistik yang muncul paling akhir"], correctAnswer: 2, explanation: "Fonologi berkedudukan sebagai fondasi analisis linguistik karena pemahaman tentang bunyi bahasa diperlukan dalam analisis morfologi (perubahan bunyi akibat afiksasi), sintaksis (tekanan dan intonasi), maupun semantik (perbedaan makna akibat perbedaan fonem)." },
            { question: "Alat-alat ucap manusia berperan penting dalam produksi bunyi bahasa. Organ yang berfungsi sebagai penghasil arus udara utama dalam proses produksi bunyi adalah…", options: ["Lidah", "Paru-paru", "Pita suara", "Rongga mulut"], correctAnswer: 1, explanation: "Paru-paru merupakan sumber arus udara utama dalam produksi bunyi bahasa. Udara yang dikeluarkan dari paru-paru kemudian dimodifikasi oleh organ-organ ucap lainnya seperti pita suara, lidah, dan bibir untuk menghasilkan bunyi yang berbeda-beda." },
            { question: "Dalam klasifikasi bunyi bahasa, kontoid dan vokoid memiliki perbedaan mendasar. Manakah pernyataan yang tepat tentang vokoid?", options: ["Vokoid dihasilkan dengan hambatan total pada rongga mulut", "Vokoid selalu melibatkan getaran pita suara dengan arus udara tidak terhambat", "Vokoid hanya dapat muncul pada posisi akhir kata", "Vokoid dihasilkan dengan menyempitkan rongga hidung secara total"], correctAnswer: 1, explanation: "Vokoid (vokal dalam fonetik) dihasilkan dengan arus udara yang tidak mengalami hambatan berarti saat melewati rongga supraglotal, dan pada umumnya melibatkan getaran pita suara. Berbeda dengan kontoid yang selalu melibatkan hambatan atau penyempitan tertentu." },
            { question: "Pasangan minimal digunakan untuk membuktikan status fonemis suatu bunyi. Pasangan kata manakah yang dapat digunakan untuk membuktikan bahwa /p/ dan /b/ adalah dua fonem yang berbeda dalam bahasa Indonesia?", options: ["pagi – bagi", "pakai – bakar", "pukul – bukaan", "pintu – bintang"], correctAnswer: 0, explanation: "Pasangan minimal harus terdiri dari dua kata yang hanya berbeda pada satu bunyi di posisi yang sama dan memiliki makna berbeda. 'pagi' dan 'bagi' berbeda hanya pada bunyi pertama /p/ dan /b/ sehingga membuktikan keduanya adalah fonem yang berbeda." },
            { question: "Silabel atau suku kata memiliki struktur tertentu dalam bahasa Indonesia. Manakah yang merupakan struktur silabel yang TIDAK lazim dalam bahasa Indonesia asli (non-serapan)?", options: ["KV (konsonan-vokal)", "VK (vokal-konsonan)", "KVK (konsonan-vokal-konsonan)", "KKV (konsonan-konsonan-vokal)"], correctAnswer: 3, explanation: "Bahasa Indonesia asli umumnya tidak mengenal gugus konsonan (kluster) di awal suku kata. Struktur KKV seperti dalam kata 'krim' atau 'studi' merupakan pola yang berasal dari kata serapan." },
            { question: "Perubahan bunyi dapat terjadi dalam berbagai bentuk. Proses perubahan bunyi di mana sebuah fonem menjadi hilang karena pengaruh bunyi di sekitarnya disebut…", options: ["Asimilasi", "Disimilasi", "Apokop", "Metatesis"], correctAnswer: 2, explanation: "Apokop adalah peristiwa penghilangan fonem pada akhir kata. Apokop termasuk jenis perubahan bunyi berupa pelesapan." },
            { question: "Dalam kajian morfologi, morfem bebas dan morfem terikat memiliki perbedaan distribusional. Contoh morfem terikat dalam bahasa Indonesia adalah…", options: ["Rumah", "Meja", "Me-", "Buku"], correctAnswer: 2, explanation: "Morfem terikat adalah morfem yang tidak dapat berdiri sendiri sebagai kata dan harus melekat pada morfem lain. Prefiks 'me-' merupakan contoh morfem terikat karena tidak dapat digunakan secara mandiri." },
            { question: "Dalam kajian elemen morfologi, alomorf merupakan konsep penting. Apakah yang dimaksud dengan alomorf?", options: ["Morfem yang memiliki makna berbeda dalam konteks berbeda", "Variasi bentuk dari suatu morfem yang tidak mengubah makna gramatikalnya", "Morfem baru yang terbentuk akibat penggabungan dua morfem bebas", "Morfem dasar yang menjadi inti pembentukan kata turunan"], correctAnswer: 1, explanation: "Alomorf adalah variasi bentuk fonemis dari suatu morfem yang sama. Misalnya, morfem {meN-} memiliki alomorf me-, mem-, men-, meng-, meny-, dan menge- yang merupakan variasi bentuk namun memiliki fungsi gramatikal yang sama." },
            { question: "Prefiks meN- dalam bahasa Indonesia mengalami perubahan bentuk bergantung pada fonem awal kata dasarnya. Bentuk alomorf yang tepat untuk kata 'meN- + tulis' adalah…", options: ["Menulis", "Menyulis", "Mentulis", "Mengtulis"], correctAnswer: 0, explanation: "Prefiks meN- berubah menjadi men- apabila kata dasar diawali dengan fonem /t/, /d/. Pada kasus 'meN- + tulis', fonem /t/ pada awal kata dasar luluh dan prefiks menjadi 'men-', sehingga menghasilkan 'menulis'." },
            { question: "Reduplikasi dalam bahasa Indonesia memiliki berbagai fungsi gramatikal. Apakah fungsi utama reduplikasi pada kata 'buku-buku' dalam kalimat 'Ia membeli buku-buku di toko itu'?", options: ["Menyatakan tindakan yang dilakukan berulang-ulang", "Menyatakan makna jamak atau banyak", "Menyatakan makna saling atau reciprocal", "Menyatakan makna menyerupai atau seperti"], correctAnswer: 1, explanation: "Reduplikasi penuh pada nomina seperti 'buku-buku' berfungsi untuk menyatakan makna jamak atau plural, yaitu menunjukkan bahwa benda yang dimaksud berjumlah banyak." },
            { question: "Bentuk reduplikasi dalam bahasa Indonesia tidak selalu berupa pengulangan penuh. Contoh reduplikasi parsial (sebagian) adalah…", options: ["Rumah-rumah", "Sayur-mayur", "Lelaki", "Bermain-main"], correctAnswer: 2, explanation: "Reduplikasi parsial atau sebagian adalah pengulangan yang hanya melibatkan sebagian morfem dasar. 'Lelaki' berasal dari pengulangan suku pertama 'le-' dari kata 'laki'." },
            { question: "Kata majemuk dalam bahasa Indonesia memiliki ciri-ciri tertentu yang membedakannya dari frasa biasa. Manakah yang merupakan kata majemuk yang maknanya tidak dapat ditelusuri dari unsur-unsur pembentuknya?", options: ["Rumah besar", "Meja makan", "Kambing hitam (dalam makna orang yang disalahkan)", "Buku merah"], correctAnswer: 2, explanation: "Kata majemuk yang bersifat idiomatis memiliki makna yang tidak transparan dari unsur-unsurnya. 'Kambing hitam' dalam arti orang yang dipersalahkan adalah kata majemuk idiomatis." },
            { question: "Abreviasi merupakan proses pemendekan bentuk dalam bahasa Indonesia. Manakah yang merupakan contoh akronim (bukan singkatan biasa)?", options: ["DPR (Dewan Perwakilan Rakyat)", "dll. (dan lain-lain)", "BUMN (Badan Usaha Milik Negara)", "ABRI (Angkatan Bersenjata Republik Indonesia)"], correctAnswer: 3, explanation: "Akronim adalah singkatan yang terbentuk dari huruf atau suku kata dan dapat dilafalkan sebagai sebuah kata. 'ABRI' dilafalkan sebagai satu kata /abri/, bukan dieja huruf per huruf." },
            { question: "Dalam analisis morfologis berbasis morfem, kata 'pemberontakan' dapat dianalisis menjadi morfem-morfem pembentuknya. Manakah analisis yang benar?", options: ["pe- + memberontak + -an", "pem- + berontak + -an", "peN- + ber- + ontak + -an", "pe- + ber- + rontak + -an"], correctAnswer: 2, explanation: "Kata 'pemberontakan' dibentuk dari morfem-morfem: prefiks peN- (yang beralomorf pem-) + prefiks ber- + bentuk dasar 'ontak' + sufiks -an." },
            { question: "Morfofonemik mengkaji perubahan fonem yang terjadi akibat proses morfologis. Peristiwa morfofonemik apakah yang terjadi pada pembentukan kata 'menyapu' dari meN- + sapu?", options: ["Penambahan fonem", "Perubahan fonem /n/ menjadi /ny/", "Peluluhan fonem /s/ dan munculnya /ny/", "Asimilasi fonem /n/ terhadap /s/"], correctAnswer: 2, explanation: "Pada proses meN- + sapu menjadi 'menyapu', terjadi peristiwa morfofonemik berupa peluluhan fonem /s/ di awal kata dasar dan kemunculan fonem /ny/ sebagai alomorf dari prefiks meN-." },
            { question: "Morfosintaksis mengkaji hubungan antara morfologi dan sintaksis. Gejala morfosintaksis yang berkaitan dengan kelas kata mana yang terlihat pada fenomena kata 'kepala' yang dapat berfungsi sebagai nomina dalam 'kepala sekolah' dan berubah fungsi dalam konteks sintaksis tertentu?", options: ["Afiksasi derivasional yang mengubah kelas kata", "Konversi atau perubahan kelas kata tanpa penambahan afiks", "Reduplikasi yang menghasilkan kelas kata baru", "Pemajemukan yang membentuk kata benda baru"], correctAnswer: 1, explanation: "Fenomena kata yang sama dapat berkelas kata berbeda tanpa penambahan afiks disebut konversi. Konversi memperlihatkan perpindahan kelas kata tanpa perubahan bentuk morfologis." },
            { question: "Fonologi sebagai cabang ilmu linguistik memiliki objek kajian utama yang berkaitan dengan…", options: ["Struktur kalimat dan hubungan antarkata", "Bunyi bahasa dan fungsinya dalam sistem bahasa", "Makna kata dan hubungan semantis", "Pembentukan kata melalui afiksasi"], correctAnswer: 1, explanation: "Fonologi mengkaji bunyi bahasa secara sistematis, termasuk fungsi bunyi dalam membedakan makna dalam suatu bahasa." },
            { question: "Manfaat fonologi dalam kajian linguistik antara lain adalah sebagai dasar untuk mempelajari bidang linguistik lainnya. Bidang linguistik mana yang paling langsung bergantung pada analisis fonologi?", options: ["Semantik leksikal", "Sintaksis transformasional", "Morfologi dan morfofonemik", "Pragmatik kontekstual"], correctAnswer: 2, explanation: "Morfologi dan morfofonemik sangat bergantung pada analisis fonologi karena perubahan bentuk morfem sering kali dipicu oleh faktor-faktor fonologis." },
            { question: "Dalam kajian fonetik, alat ucap yang berfungsi sebagai penghasil arus udara utama untuk memproduksi bunyi bahasa adalah…", options: ["Laring", "Paru-paru", "Rongga mulut", "Velum"], correctAnswer: 1, explanation: "Paru-paru merupakan sumber arus udara utama dalam produksi bunyi bahasa." },
            { question: "Bunyi bahasa yang diklasifikasikan sebagai kontoid dibedakan dari vokoid berdasarkan…", options: ["Tinggi rendahnya nada yang dihasilkan", "Ada atau tidaknya hambatan pada rongga ucap", "Panjang pendeknya durasi bunyi", "Keras lemahnya tekanan bunyi"], correctAnswer: 1, explanation: "Kontoid adalah bunyi yang dalam produksinya terdapat hambatan atau penyempitan pada rongga ucap, sedangkan vokoid diproduksi tanpa hambatan." },
            { question: "Dua bunyi bahasa dikatakan sebagai fonem yang berbeda apabila keduanya bersifat…", options: ["Komplementer dalam distribusi", "Identik dalam semua konteks fonetis", "Distingtif atau membedakan makna", "Bervariasi secara bebas tanpa perbedaan makna"], correctAnswer: 2, explanation: "Fonem adalah satuan bunyi terkecil yang bersifat distingtif, yaitu mampu membedakan makna." },
            { question: "Struktur silabel bahasa Indonesia yang paling dasar terdiri atas komponen…", options: ["Onset, nukleus, dan koda", "Fonem, morfem, dan silabel", "Vokal, konsonan, dan diftong", "Prefiks, sufiks, dan infiks"], correctAnswer: 0, explanation: "Struktur silabel secara universal terdiri atas onset (awal silabel), nukleus (inti silabel berupa vokal), dan koda (penutup silabel)." },
            { question: "Dalam bahasa Indonesia, kata 'syair' mengandung diftong. Diftong adalah…", options: ["Dua konsonan yang berdampingan dalam satu silabel", "Dua vokal yang bergabung membentuk satu silabel dengan satu puncak kenyaringan", "Perubahan bunyi vokal menjadi konsonan", "Gugus konsonan di awal kata"], correctAnswer: 1, explanation: "Diftong adalah dua vokal yang bergabung dalam satu silabel dan membentuk satu puncak kenyaringan." },
            { question: "Proses asimilasi sebagai salah satu jenis perubahan bunyi terjadi ketika…", options: ["Sebuah bunyi dihilangkan dari suatu kata", "Sebuah bunyi berubah menjadi lebih mirip dengan bunyi yang berdekatan", "Urutan bunyi dalam kata dibalik", "Sebuah bunyi baru ditambahkan dalam kata"], correctAnswer: 1, explanation: "Asimilasi adalah proses perubahan bunyi di mana suatu bunyi menjadi lebih mirip atau sama dengan bunyi yang berada di dekatnya." },
            { question: "Dalam morfologi, satuan gramatikal terkecil yang mengandung makna dan tidak dapat dibagi lagi menjadi satuan yang lebih kecil disebut…", options: ["Silabel", "Fonem", "Morfem", "Leksem"], correctAnswer: 2, explanation: "Morfem adalah satuan gramatikal terkecil yang mengandung makna." },
            { question: "Afiks yang dilekatkan di awal bentuk dasar disebut prefiks. Contoh prefiks dalam bahasa Indonesia adalah…", options: ["-kan dan -i", "meN- dan ber-", "-el- dan -em-", "ke-…-an dan pe-…-an"], correctAnswer: 1, explanation: "Prefiks adalah afiks yang dilekatkan di awal bentuk dasar. Dalam bahasa Indonesia, meN- dan ber- adalah contoh prefiks." },
            { question: "Proses afiksasi yang menghasilkan kata 'pelajaran' melibatkan bentuk dasar 'ajar' dengan penambahan konfiks…", options: ["pe-…-an", "per-…-an", "ke-…-an", "ber-…-an"], correctAnswer: 0, explanation: "Kata 'pelajaran' dibentuk dari bentuk dasar 'ajar' dengan konfiks pe-…-an, menghasilkan 'pe-ajar-an' → 'pelajaran'." },
            { question: "Reduplikasi yang mengulang seluruh bentuk dasar tanpa perubahan apapun disebut…", options: ["Reduplikasi parsial", "Reduplikasi berimbuhan", "Reduplikasi penuh", "Reduplikasi berubah bunyi"], correctAnswer: 2, explanation: "Reduplikasi penuh atau reduplikasi seluruh adalah pengulangan seluruh bentuk dasar tanpa perubahan, misalnya 'buku-buku', 'meja-meja'." },
            { question: "Kata majemuk dalam bahasa Indonesia memiliki ciri khas dibandingkan frasa biasa, yaitu…", options: ["Selalu terdiri atas dua kata benda", "Maknanya tidak dapat diramalkan dari makna unsur-unsurnya secara terpisah", "Selalu dapat disisipi kata lain di antara unsur-unsurnya", "Selalu menggunakan tanda hubung dalam penulisannya"], correctAnswer: 1, explanation: "Salah satu ciri kata majemuk adalah memiliki makna yang tidak dapat diramalkan begitu saja dari makna masing-masing unsurnya. Misalnya 'meja hijau'." },
            { question: "Proses abreviasi yang menghasilkan bentuk singkatan berupa gabungan huruf awal setiap kata dan dapat dilafalkan sebagai sebuah kata adalah…", options: ["Singkatan", "Akronim", "Kontraksi", "Penggalan"], correctAnswer: 1, explanation: "Akronim adalah abreviasi yang dibentuk dari huruf awal atau suku kata beberapa kata dan dapat dilafalkan sebagai satu kata, misalnya ABRI, BAPPENAS." },
            { question: "Dalam analisis morfologis berbasis morfem, kata 'ketidakhadiran' dapat dianalisis sebagai…", options: ["ke + tidak + hadir + an", "ketidak + hadiran", "ke + tidakhadir + an", "ketidak + hadir + an"], correctAnswer: 0, explanation: "Analisis morfologis berbasis morfem memecah kata menjadi morfem-morfem penyusunnya. 'Ketidakhadiran' terdiri atas prefiks ke-, kata tidak, bentuk dasar hadir, dan sufiks -an." },
            { question: "Fenomena morfofonemik yang terjadi ketika prefiks meN- bertemu dengan bentuk dasar yang berawalan fonem /p/ menghasilkan…", options: ["Penambahan bunyi /m/ sebelum /p/", "Penghilangan fonem /p/ dan nasalisasi menjadi /m/", "Perubahan /p/ menjadi /b/", "Penambahan vokal /e/ di antara nasal dan /p/"], correctAnswer: 1, explanation: "Dalam morfofonemik bahasa Indonesia, prefiks meN- + bentuk dasar berawalan /p/ menyebabkan fonem /p/ luluh dan digantikan oleh nasal /m/." },
            { question: "Dalam kajian morfosintaksis, kelas kata suatu bentuk ditentukan berdasarkan…", options: ["Jumlah silabel yang membentuk kata tersebut", "Asal usul etimologis kata dalam bahasa sumber", "Distribusi dan fungsi kata dalam konstruksi sintaktis", "Jumlah morfem yang menyusun kata tersebut"], correctAnswer: 2, explanation: "Morfosintaksis mengkaji kelas kata berdasarkan distribusi dan fungsinya dalam konstruksi sintaktis." },
            { question: "Fonologi sebagai cabang linguistik memiliki objek kajian utama yang berkaitan dengan …", options: ["Makna kata dalam konteks kalimat", "Bunyi bahasa yang berfungsi sebagai pembeda makna", "Struktur kalimat dan frasa dalam bahasa", "Hubungan morfem dengan sintaksis"], correctAnswer: 1, explanation: "Fonologi mengkaji bunyi bahasa, khususnya fonem yang berfungsi membedakan makna kata dalam suatu bahasa." },
            { question: "Salah satu manfaat utama mempelajari fonologi dalam kaitannya dengan bahasa Indonesia adalah …", options: ["Memahami struktur kalimat majemuk", "Mengetahui cara pembentukan kata baru melalui afiksasi", "Membantu pengajaran ejaan dan pelafalan yang benar", "Menganalisis hubungan antar klausa dalam wacana"], correctAnswer: 2, explanation: "Fonologi bermanfaat dalam pengajaran bahasa, khususnya untuk memahami ejaan dan pelafalan yang benar." },
            { question: "Dalam klasifikasi bunyi bahasa, bunyi yang dihasilkan dengan melibatkan pita suara yang bergetar disebut …", options: ["Bunyi tak bersuara", "Bunyi bersuara", "Bunyi nasal", "Bunyi frikatif"], correctAnswer: 1, explanation: "Bunyi bersuara adalah bunyi yang dihasilkan dengan pita suara yang bergetar selama proses produksi bunyi." },
            { question: "Kontoid dan vokoid merupakan istilah dalam fonetik yang digunakan untuk membedakan …", options: ["Fonem vokal dan konsonan dalam sistem ejaan", "Bunyi konsonan dan vokal berdasarkan cara produksinya secara fonetis", "Silabel terbuka dan silabel tertutup dalam kata", "Diftong dan kluster dalam struktur kata"], correctAnswer: 1, explanation: "Kontoid mengacu pada bunyi yang secara fonetis bersifat konsonantal, sedangkan vokoid mengacu pada bunyi yang bersifat vokalik." },
            { question: "Pasangan minimal (minimal pair) digunakan dalam fonemik untuk …", options: ["Menentukan jumlah silabel dalam sebuah kata", "Membuktikan bahwa dua bunyi merupakan fonem yang berbeda", "Mengklasifikasikan jenis-jenis afiks dalam bahasa Indonesia", "Menganalisis perubahan bunyi akibat lingkungan fonetis"], correctAnswer: 1, explanation: "Pasangan minimal digunakan untuk membuktikan bahwa dua bunyi adalah fonem berbeda karena keduanya membedakan makna kata." },
            { question: "Struktur silabel KVK pada kata 'bak' menunjukkan pola …", options: ["Konsonan-Vokal-Konsonan dengan silabel tertutup", "Vokal-Konsonan-Vokal dengan silabel terbuka", "Konsonan-Konsonan-Vokal dengan gugus konsonan", "Vokal-Vokal-Konsonan dengan diftong"], correctAnswer: 0, explanation: "Pola KVK berarti Konsonan-Vokal-Konsonan, dan karena diakhiri konsonan, silabel tersebut disebut silabel tertutup." },
            { question: "Diftong berbeda dari kluster karena diftong merupakan …", options: ["Dua konsonan yang muncul berurutan dalam satu silabel", "Dua vokal yang diucapkan dalam satu silabel membentuk satu bunyi luncur", "Perpaduan konsonan dan vokal dalam posisi awal kata", "Gugus bunyi yang selalu berada di posisi akhir kata"], correctAnswer: 1, explanation: "Diftong adalah dua vokal yang diucapkan dalam satu silabel menghasilkan bunyi luncur, sedangkan kluster adalah gugus konsonan." },
            { question: "Proses perubahan bunyi di mana suatu bunyi menjadi lebih mirip dengan bunyi di sekitarnya disebut …", options: ["Disimilasi", "Metatesis", "Asimilasi", "Epentesis"], correctAnswer: 2, explanation: "Asimilasi adalah proses perubahan bunyi di mana suatu bunyi berubah menjadi lebih mirip dengan bunyi yang berada di sekitarnya." },
            { question: "Salah satu problematika perubahan bunyi dalam bahasa Indonesia adalah variasi pengucapan fonem /e/ yang dapat berupa …", options: ["Fonem /e/ selalu diucapkan sama dalam semua kata", "Fonem /e/ memiliki dua realisasi yaitu [e] dan [ə] tergantung konteks", "Fonem /e/ hanya muncul di posisi awal kata", "Fonem /e/ tidak pernah muncul dalam silabel tertutup"], correctAnswer: 1, explanation: "Dalam bahasa Indonesia, /e/ dapat direalisasikan sebagai [e] (e taling) atau [ə] (e pepet) tergantung konteksnya." },
            { question: "Morfem terikat dalam morfologi adalah morfem yang …", options: ["Dapat berdiri sendiri sebagai kata dalam tuturan", "Hanya bermakna bila digabungkan dengan morfem lain", "Selalu berupa kata dasar dalam kamus", "Tidak pernah mengalami perubahan bentuk"], correctAnswer: 1, explanation: "Morfem terikat adalah morfem yang tidak dapat berdiri sendiri dan harus bergabung dengan morfem lain untuk memiliki makna atau fungsi." },
            { question: "Dalam proses afiksasi, prefiks meN- pada kata 'menulis' mengalami perubahan bentuk menjadi 'menu-' karena mengikuti kaidah …", options: ["Asimilasi fonemis di mana nasal menyesuaikan titik artikulasi konsonan awal kata dasar", "Penghilangan vokal pada akhir prefiks sebelum konsonan", "Penambahan fonem /l/ untuk memperlancar pengucapan", "Perubahan total bentuk prefiks tanpa aturan tertentu"], correctAnswer: 0, explanation: "Prefiks meN- berubah bentuknya mengikuti asimilasi nasal: bunyi nasal /n/ menyesuaikan diri dengan titik artikulasi konsonan awal kata dasar." },
            { question: "Reduplikasi parsial dalam bahasa Indonesia adalah proses pengulangan yang …", options: ["Mengulang seluruh bentuk kata dasar secara penuh", "Hanya mengulang sebagian dari bentuk dasar", "Mengulang kata dasar dengan perubahan bunyi vokal", "Mengulang kata dasar yang telah mendapat imbuhan"], correctAnswer: 1, explanation: "Reduplikasi parsial hanya mengulang sebagian bentuk dasar, misalnya 'lelaki' dari 'laki'." },
            { question: "Kata majemuk berbeda dari frasa karena kata majemuk …", options: ["Terdiri dari dua kata yang masih dapat disisipkan kata lain di antaranya", "Merupakan gabungan dua morfem bebas yang membentuk satu konsep baru dan tidak dapat disisipi", "Selalu terdiri dari kata sifat dan kata benda", "Hanya dibentuk melalui proses afiksasi"], correctAnswer: 1, explanation: "Kata majemuk adalah gabungan dua kata yang membentuk satu konsep baru dan bersifat padu sehingga tidak dapat disisipi unsur lain." },
            { question: "Akronim sebagai salah satu bentuk abreviasi berbeda dari singkatan karena akronim …", options: ["Dibaca huruf per huruf sesuai nama abjad", "Dibaca sebagai sebuah kata utuh bukan huruf per huruf", "Hanya terdiri dari satu huruf kapital", "Selalu menggunakan tanda titik di antara hurufnya"], correctAnswer: 1, explanation: "Akronim dibaca sebagai kata utuh (misalnya ABRI, BAPPENAS), sedangkan singkatan dibaca huruf per huruf." },
            { question: "Dalam analisis morfologis berbasis morfem, kata 'pemberitahuan' dapat dianalisis menjadi …", options: ["Satu morfem bebas dan satu morfem terikat", "Morfem pe(N)-, berita, -kan, dan -an sebagai unsur-unsur pembentuknya", "Dua kata dasar yang bergabung tanpa imbuhan", "Hanya terdiri dari satu morfem bebas"], correctAnswer: 1, explanation: "Analisis berbasis morfem memisahkan semua unsur morfemis: prefiks pe(N)-, kata dasar 'berita', sufiks -kan, dan sufiks -an." },
            { question: "Morfofonemik mengkaji hubungan antara morfologi dan fonologi, terutama berkenaan dengan …", options: ["Cara fonem membentuk silabel dalam struktur kata dasar", "Perubahan bentuk morfem yang terjadi akibat proses morfologis seperti afiksasi", "Penggolongan kata berdasarkan kelas kata dalam sintaksis", "Analisis wacana berdasarkan pola intonasi kalimat"], correctAnswer: 1, explanation: "Morfofonemik mengkaji perubahan bentuk fonemis yang terjadi pada morfem ketika mengalami proses morfologis seperti afiksasi." }
          ],
          "Cerita Rekaan": [
            { question: "Cerita rekaan (cerkan) pada hakikatnya adalah karya sastra yang bersifat imajinatif dan fiktif. Apa yang membedakan cerkan dari karya nonfiksi?", options: ["Cerkan menggunakan bahasa formal dan baku", "Cerkan dibangun berdasarkan imajinasi dan kreativitas pengarang, bukan fakta nyata", "Cerkan selalu memiliki alur yang linear dan runtut", "Cerkan hanya mengangkat tema kehidupan sehari-hari"], correctAnswer: 1, explanation: "Cerkan (cerita rekaan) adalah karya sastra yang dibangun berdasarkan imajinasi dan kreativitas pengarang sehingga bersifat fiktif." },
            { question: "Dalam perspektif sastra, cerita rekaan dipandang sebagai representasi kehidupan yang dikemas secara artistik. Pandangan ini merujuk pada konsep cerkan sebagai…", options: ["Dokumen sejarah yang autentik", "Laporan ilmiah tentang masyarakat", "Mimesis atau tiruan kehidupan yang diolah secara estetis", "Catatan pribadi pengarang tentang pengalamannya"], correctAnswer: 2, explanation: "Cerkan dalam perspektif sastra dipandang sebagai mimesis, yaitu tiruan atau representasi kehidupan yang diolah secara estetis oleh pengarang." },
            { question: "Aliran romantisme dalam cerita rekaan ditandai oleh ciri-ciri tertentu. Manakah yang paling tepat mencerminkan aliran romantisme?", options: ["Menggambarkan kehidupan secara objektif dan apa adanya berdasarkan fakta sosial", "Menonjolkan perasaan, imajinasi, keindahan alam, dan idealisme yang tinggi", "Menampilkan tokoh-tokoh yang dikuasai oleh dorongan naluri dan lingkungan", "Menggunakan simbol-simbol abstrak untuk menyampaikan makna tersembunyi"], correctAnswer: 1, explanation: "Aliran romantisme ditandai dengan penonjolan perasaan subjektif, imajinasi, keindahan alam, dan idealisme yang tinggi." },
            { question: "Aliran naturalisme dalam cerkan merupakan pengembangan dari aliran realisme. Apa ciri khas yang membedakan naturalisme dari realisme?", options: ["Naturalisme lebih menekankan keindahan bahasa dan gaya penulisan", "Naturalisme menggambarkan manusia sebagai makhluk yang sepenuhnya ditentukan oleh faktor biologis dan lingkungan", "Naturalisme mengutamakan nilai-nilai spiritual dan moral dalam cerita", "Naturalisme berfokus pada pengalaman batin dan perasaan tokoh secara mendalam"], correctAnswer: 1, explanation: "Naturalisme memandang manusia sepenuhnya ditentukan oleh faktor biologis, hereditas, dan lingkungan sosialnya, sehingga penggambaran lebih keras dan deterministik." },
            { question: "Karya sastra Melayu Klasik yang termasuk dalam kategori cerkan Melayu klasik umumnya memiliki ciri khas berupa…", options: ["Tokoh-tokoh dari kalangan rakyat biasa dengan konflik sosial yang realistis", "Tokoh-tokoh berupa raja, bangsawan, dan dewa dengan latar kerajaan dan alam gaib", "Penggunaan sudut pandang orang pertama yang kuat dan pengakuan autobiografis", "Alur yang tidak beraturan dan bersifat absurd serta penuh kontradiksi"], correctAnswer: 1, explanation: "Cerkan Melayu Klasik umumnya menampilkan tokoh-tokoh dari kalangan raja, bangsawan, atau dewa dengan latar kerajaan dan alam gaib." },
            { question: "Periode cerkan prakemerdekaan Indonesia ditandai dengan munculnya karya-karya yang banyak mengangkat tema…", options: ["Petualangan antariksa dan teknologi futuristik", "Persoalan adat, pendidikan, dan semangat kebangkitan nasional", "Kehidupan metropolitan dan budaya pop modern", "Romantisme alam pegunungan dan kehidupan desa terpencil semata"], correctAnswer: 1, explanation: "Cerkan prakemerdekaan Indonesia banyak mengangkat tema persoalan adat, pendidikan, dan semangat kebangkitan nasional seiring dengan tumbuhnya kesadaran nasionalisme bangsa Indonesia." },
            { question: "Perbedaan utama antara cerpen dan novel sebagai dua jenis cerita rekaan terletak pada…", options: ["Bahasa yang digunakan; cerpen memakai bahasa puitis sedangkan novel memakai bahasa prosa", "Panjang cerita, kompleksitas alur, dan kedalaman pengembangan tokoh", "Tema; cerpen hanya mengangkat tema ringan sedangkan novel selalu serius", "Cerpen selalu menggunakan alur maju sedangkan novel menggunakan alur mundur"], correctAnswer: 1, explanation: "Perbedaan utama cerpen dan novel terletak pada panjang cerita, kompleksitas alur, serta kedalaman pengembangan tokoh dan latar." },
            { question: "Novel populer berbeda dari novel serius dalam hal orientasinya. Novel populer cenderung berorientasi pada…", options: ["Perenungan mendalam tentang kondisi sosial dan eksistensial manusia", "Hiburan dan pemenuhan selera pasar pembaca umum secara komersial", "Eksperimentasi bentuk dan teknik narasi yang inovatif", "Kritik sastra akademis dan diskusi intelektual yang serius"], correctAnswer: 1, explanation: "Novel populer cenderung berorientasi pada hiburan dan pemenuhan selera pasar pembaca secara komersial." },
            { question: "Dalam telaah unsur intrinsik cerita rekaan, yang dimaksud dengan tema adalah…", options: ["Urutan peristiwa yang membentuk jalinan cerita dari awal hingga akhir", "Gagasan pokok atau ide dasar yang menjadi landasan keseluruhan cerita", "Latar waktu, tempat, dan suasana yang melingkupi jalannya cerita", "Cara pengarang menyampaikan cerita melalui pilihan sudut pandang tertentu"], correctAnswer: 1, explanation: "Tema adalah gagasan pokok atau ide dasar yang menjadi landasan dan pusat keseluruhan cerita rekaan." },
            { question: "Unsur ekstrinsik dalam cerita rekaan adalah unsur yang berada di luar teks sastra tetapi mempengaruhi penciptaan karya. Contoh unsur ekstrinsik adalah…", options: ["Alur, tokoh, dan latar yang membangun cerita", "Dialog antartokoh dan gaya bahasa pengarang", "Latar belakang sosial budaya pengarang dan kondisi masyarakat saat karya ditulis", "Sudut pandang dan amanat yang terkandung dalam teks cerita"], correctAnswer: 2, explanation: "Unsur ekstrinsik adalah unsur yang berada di luar teks tetapi mempengaruhi penciptaan karya, seperti latar belakang sosial budaya pengarang, kondisi masyarakat, ideologi, dan situasi sejarah." },
            { question: "Apresiasi cerita rekaan melalui kegiatan membaca memerlukan keterlibatan aktif pembaca. Tahap membaca yang melibatkan pemaknaan mendalam terhadap teks disebut…", options: ["Membaca sekilas untuk menangkap informasi umum cerita", "Membaca pemahaman yang melibatkan interpretasi dan penghayatan isi cerita", "Membaca cepat untuk menemukan data dan fakta spesifik", "Membaca nyaring untuk melatih pelafalan dan intonasi"], correctAnswer: 1, explanation: "Dalam apresiasi cerkan, membaca pemahaman merupakan tahap yang melibatkan interpretasi dan penghayatan isi cerita secara mendalam." },
            { question: "Dalam telaah struktural cerita rekaan, alur (plot) dibedakan menjadi beberapa jenis berdasarkan urutan penyajiannya. Alur yang menyajikan cerita dari masa kini ke masa lampau disebut…", options: ["Alur maju (progresif)", "Alur campuran (in medias res)", "Alur mundur (regresif/flashback)", "Alur melingkar (sirkular)"], correctAnswer: 2, explanation: "Alur mundur (regresif) atau flashback adalah alur yang menyajikan cerita dari peristiwa masa kini kemudian bergerak ke masa lampau." },
            { question: "Sudut pandang (point of view) orang ketiga mahatahu dalam cerita rekaan ditandai dengan…", options: ["Pengarang menggunakan kata ganti 'aku' sebagai tokoh utama cerita", "Narator mengetahui segalanya tentang semua tokoh, pikiran, dan perasaan mereka", "Pengarang membatasi pengetahuannya hanya pada satu tokoh saja", "Tokoh menceritakan pengalaman orang lain yang ia saksikan secara langsung"], correctAnswer: 1, explanation: "Sudut pandang orang ketiga mahatahu ditandai dengan narator yang memiliki pengetahuan penuh (omniscient) tentang semua tokoh." },
            { question: "Sosiologi pengarang dalam telaah sosiologis cerita rekaan memfokuskan kajian pada…", options: ["Bagaimana karya sastra diterima dan diinterpretasikan oleh masyarakat pembaca", "Nilai-nilai sosial yang terkandung dalam teks karya sastra itu sendiri", "Latar belakang sosial, ekonomi, dan ideologi pengarang yang mempengaruhi karyanya", "Pengaruh karya sastra terhadap perubahan perilaku sosial masyarakat"], correctAnswer: 2, explanation: "Sosiologi pengarang mengkaji latar belakang sosial, ekonomi, dan ideologi pengarang sebagai produsen karya sastra yang mempengaruhi proses kreatif dan isi karyanya." },
            { question: "Resensi cerita rekaan berbeda dari responsi dalam hal tujuan dan sifatnya. Resensi cerkan bertujuan untuk…", options: ["Mengungkapkan tanggapan emosional dan kesan pribadi pembaca secara subjektif", "Memberikan penilaian kritis secara komprehensif meliputi kelebihan dan kekurangan karya", "Menganalisis struktur formal cerita secara ilmiah dan akademis", "Menceritakan kembali isi cerita secara lengkap kepada pembaca lain"], correctAnswer: 1, explanation: "Resensi bertujuan memberikan penilaian kritis yang komprehensif terhadap sebuah karya, meliputi kelebihan dan kekurangan." },
            { question: "Dalam kegiatan pembacaan cerkan (oral reading/story telling), aspek yang perlu diperhatikan agar penyampaian efektif adalah…", options: ["Ketepatan ejaan dan tata bahasa yang digunakan dalam naskah tertulis", "Intonasi, jeda, ekspresi wajah, dan penghayatan terhadap isi cerita", "Panjang pendeknya cerita yang akan dibacakan di depan umum", "Jumlah tokoh dan kompleksitas alur dalam cerita yang dipilih"], correctAnswer: 1, explanation: "Dalam pembacaan cerkan secara lisan, aspek penting yang harus diperhatikan meliputi intonasi, jeda, ekspresi wajah, gestur, dan penghayatan isi cerita." },
            { question: "Dalam proses reproduksi cerita rekaan, kegiatan 'tulis-ulang cerita' (rewriting) berbeda dari 'cerita-ulang' (retelling) karena…", options: ["Tulis-ulang hanya mengubah sudut pandang sedangkan cerita-ulang mengubah keseluruhan cerita", "Tulis-ulang menghasilkan produk tertulis baru dengan mengolah cerita sumber, sedangkan cerita-ulang adalah penyampaian lisan kembali isi cerita", "Tulis-ulang hanya boleh dilakukan oleh pengarang asli sedangkan cerita-ulang oleh siapa saja", "Tulis-ulang mengubah tema cerita secara mendasar sedangkan cerita-ulang mempertahankan tema aslinya"], correctAnswer: 1, explanation: "Tulis-ulang (rewriting) menghasilkan produk tertulis baru dengan mengolah cerita sumber secara kreatif, sementara cerita-ulang (retelling) adalah penyampaian kembali isi cerita secara lisan." },
            { question: "Cerita rekaan (cerkan) pada dasarnya merupakan karya sastra yang dibangun berdasarkan…", options: ["fakta sejarah yang benar-benar terjadi", "rekaan atau imajinasi pengarang yang bersumber dari pengalaman dan kenyataan", "laporan jurnalistik yang dikembangkan menjadi karya sastra", "mitos dan legenda yang diwariskan secara turun-temurun"], correctAnswer: 1, explanation: "Cerita rekaan merupakan karya sastra yang dibangun atas dasar rekaan atau imajinasi pengarang, meskipun dapat bersumber dari pengalaman dan kenyataan hidup." },
            { question: "Dalam perspektif sastra, cerita rekaan berfungsi sebagai media untuk…", options: ["menyampaikan berita dan informasi faktual kepada pembaca", "mendokumentasikan peristiwa sejarah secara kronologis", "menghibur sekaligus memberikan renungan dan wawasan tentang kehidupan", "mengajarkan tata bahasa dan kaidah berbahasa yang benar"], correctAnswer: 2, explanation: "Cerita rekaan dalam perspektif sastra memiliki fungsi ganda, yaitu dulce et utile (menghibur sekaligus berguna)." },
            { question: "Aliran romantisme dalam cerita rekaan ditandai oleh kecenderungan pengarang untuk…", options: ["menggambarkan kehidupan masyarakat secara objektif dan apa adanya", "mengutamakan keindahan, perasaan, dan idealisme dalam karya", "mengungkap sisi kelam dan buruk kehidupan manusia secara gamblang", "menggunakan simbol-simbol tersembunyi untuk menyampaikan makna"], correctAnswer: 1, explanation: "Aliran romantisme menonjolkan keindahan, perasaan, dan idealisme. Pengarang romantis cenderung mengidealkan kehidupan dan mengutamakan ekspresi emosi serta imajinasi yang bebas." },
            { question: "Perbedaan utama antara aliran realisme dan naturalisme dalam cerita rekaan adalah…", options: ["realisme menggambarkan kenyataan secara selektif, sedangkan naturalisme menggambarkan kenyataan secara deterministik dan ilmiah", "realisme bersifat idealis, sedangkan naturalisme bersifat romantis", "realisme menggunakan simbol, sedangkan naturalisme menggunakan alegori", "realisme berasal dari Prancis, sedangkan naturalisme berasal dari Inggris"], correctAnswer: 0, explanation: "Realisme menggambarkan kenyataan secara selektif dan wajar, sedangkan naturalisme lebih ekstrem dengan memandang manusia sebagai produk lingkungan dan keturunan secara deterministik-ilmiah." },
            { question: "Aliran absurdisme dalam cerita rekaan menampilkan…", options: ["keindahan alam sebagai latar dominan dalam narasi", "kehidupan sosial masyarakat kelas bawah secara gamblang", "ketidakbermaknaan dan kekonyolan eksistensi manusia di dunia", "perjuangan nasional dan semangat patriotisme"], correctAnswer: 2, explanation: "Absurdisme menampilkan pandangan bahwa kehidupan manusia pada dasarnya tidak bermakna, absurd, dan penuh kekonyolan." },
            { question: "Cerkan Melayu Klasik umumnya memiliki ciri khas berupa…", options: ["tokoh-tokoh dari kalangan rakyat biasa dengan konflik sosial yang kuat", "penggunaan bahasa daerah lokal yang beragam", "tokoh-tokoh raja, pahlawan, dan bangsawan dengan latar istana", "kritik sosial yang tajam terhadap pemerintah kolonial"], correctAnswer: 2, explanation: "Cerkan Melayu Klasik umumnya menampilkan tokoh-tokoh dari kalangan bangsawan, raja, dan pahlawan dengan latar istana atau kerajaan." },
            { question: "Karya sastra Indonesia yang tergolong cerkan prakemerdekaan umumnya bertemakan…", options: ["kehidupan urban modern dan pergaulan bebas", "pertentangan antara adat lama dan pemikiran modern", "perjuangan kemerdekaan melawan penjajah Jepang", "eksistensialisme dan pencarian jati diri generasi muda"], correctAnswer: 1, explanation: "Cerkan prakemerdekaan banyak mengangkat tema pertentangan antara adat lama yang kaku dengan semangat pembaruan dan pemikiran modern." },
            { question: "Perkembangan cerkan pascakemerdekaan Indonesia ditandai dengan…", options: ["kembalinya pengaruh sastra Melayu Klasik yang kuat", "tema yang lebih beragam, eksperimental, dan mencerminkan realitas sosial-politik kontemporer", "dominasi tema percintaan romantis semata", "penggunaan bahasa Melayu Riau sebagai standar penulisan"], correctAnswer: 1, explanation: "Cerkan pascakemerdekaan mengalami perkembangan signifikan dengan tema yang semakin beragam, eksperimental, dan responsif terhadap realitas sosial-politik kontemporer." },
            { question: "Perbedaan mendasar antara cerpen dan novel terletak pada…", options: ["jenis alur yang digunakan dalam cerita", "jumlah tokoh dan kompleksitas penokohan serta panjang cerita", "penggunaan sudut pandang pengarang", "jenis tema yang boleh diangkat dalam cerita"], correctAnswer: 1, explanation: "Perbedaan mendasar cerpen dan novel terletak pada panjang cerita, jumlah tokoh, dan kompleksitas penokohan." },
            { question: "Novel populer berbeda dari novel serius terutama karena novel populer…", options: ["ditulis oleh pengarang yang lebih berpengalaman", "mengutamakan hiburan dan mudah dicerna oleh khalayak luas", "menggunakan teknik naratif yang lebih canggih dan eksperimental", "memiliki tema yang lebih berat dan filosofis"], correctAnswer: 1, explanation: "Novel populer mengutamakan aspek hiburan dan kemudahan dicerna oleh pembaca umum, sehingga bersifat lebih ringan." },
            { question: "Unsur intrinsik cerita rekaan yang berkaitan dengan urutan peristiwa dalam cerita disebut…", options: ["tema", "latar", "alur", "amanat"], correctAnswer: 2, explanation: "Alur (plot) adalah unsur intrinsik yang berkaitan dengan rangkaian atau urutan peristiwa dalam cerita yang saling berkaitan secara kausal." },
            { question: "Unsur ekstrinsik cerita rekaan mencakup hal-hal yang berada di luar teks karya sastra, antara lain…", options: ["tokoh, alur, dan latar belakang cerita", "biografi pengarang, kondisi sosial budaya, dan nilai-nilai kemasyarakatan", "sudut pandang, gaya bahasa, dan simbolisme", "tema, amanat, dan konflik dalam cerita"], correctAnswer: 1, explanation: "Unsur ekstrinsik adalah unsur yang berada di luar teks karya sastra namun memengaruhi penciptaannya, seperti biografi pengarang, kondisi sosial-budaya, nilai-nilai kemasyarakatan, dan situasi sejarah." },
            { question: "Kegiatan apresiasi cerita rekaan secara aktif mencakup proses…", options: ["menyalin teks cerita rekaan kata per kata", "membaca, memahami, menghayati, dan mengevaluasi karya secara kritis dan emosional", "menghafal nama tokoh dan alur cerita untuk ujian", "membandingkan harga buku cerita rekaan di pasaran"], correctAnswer: 1, explanation: "Apresiasi cerita rekaan secara aktif melibatkan proses membaca, memahami isi, menghayati secara emosional, dan mengevaluasi karya secara kritis." },
            { question: "Dalam telaah struktural cerita rekaan, yang dimaksud dengan sudut pandang (point of view) adalah…", options: ["pendapat pengarang tentang tema yang diangkat dalam cerita", "posisi dan cara pengarang menempatkan diri dalam menyampaikan cerita", "perspektif tokoh utama dalam menghadapi konflik", "sudut pengambilan gambar dalam adaptasi film cerita"], correctAnswer: 1, explanation: "Sudut pandang (point of view) adalah posisi dan cara pengarang menempatkan diri dalam menyampaikan cerita." },
            { question: "Sosiologi pengarang dalam telaah sosiologis cerita rekaan membahas…", options: ["dampak karya sastra terhadap perilaku pembaca di masyarakat", "nilai-nilai sosial yang terkandung dalam teks karya sastra", "latar belakang sosial, ekonomi, dan ideologi pengarang yang memengaruhi penciptaan karya", "jumlah pembaca dan distribusi karya sastra di masyarakat"], correctAnswer: 2, explanation: "Sosiologi pengarang membahas latar belakang sosial, ekonomi, dan ideologi pengarang, termasuk posisi pengarang dalam masyarakat." },
            { question: "Resensi cerita rekaan berbeda dari responsi karena resensi…", options: ["hanya dilakukan oleh pengarang karya yang bersangkutan", "bersifat penilaian menyeluruh yang ditujukan untuk pembaca umum sebagai panduan", "merupakan tanggapan subjektif pribadi tanpa kriteria penilaian", "hanya membahas unsur intrinsik tanpa mempertimbangkan konteks"], correctAnswer: 1, explanation: "Resensi merupakan penilaian menyeluruh terhadap karya sastra yang ditujukan untuk pembaca umum sebagai panduan, mencakup ringkasan, kelebihan, dan kekurangan karya." },
            { question: "Dalam kegiatan penulisan cerita rekaan, tahap prewriting (pramenulis) yang penting dilakukan adalah…", options: ["langsung menulis draf tanpa persiapan agar ide mengalir bebas", "menentukan ide, mengumpulkan bahan, membuat kerangka, dan menentukan sudut pandang", "mempublikasikan karya sebelum direvisi untuk mendapat masukan", "menyalin karya orang lain sebagai referensi dasar penulisan"], correctAnswer: 1, explanation: "Tahap prewriting dalam penulisan cerkan meliputi penentuan ide cerita, pengumpulan bahan dan referensi, pembuatan kerangka cerita, serta penentuan sudut pandang." },
            { question: "Cerita rekaan (cerkan) pada hakikatnya merupakan karya sastra yang bersifat…", options: ["Faktual dan berdasarkan kejadian nyata yang dialami pengarang", "Imajinatif dan fiktif yang dibangun dari kreativitas pengarang", "Biografis dan mencerminkan kehidupan pengarang secara langsung", "Ilmiah dan berdasarkan penelitian empiris yang mendalam"], correctAnswer: 1, explanation: "Cerita rekaan pada hakikatnya merupakan karya sastra yang bersifat imajinatif dan fiktif, dibangun dari kreativitas pengarang." },
            { question: "Dalam perspektif sastra, cerita rekaan dipandang sebagai karya seni yang memiliki fungsi utama sebagai…", options: ["Dokumentasi sejarah suatu bangsa", "Media hiburan semata bagi pembaca", "Cermin kehidupan yang memberikan pengalaman estetis dan pemahaman kemanusiaan", "Alat propaganda ideologi tertentu"], correctAnswer: 2, explanation: "Dalam perspektif sastra, cerkan dipandang sebagai cermin kehidupan yang memberikan pengalaman estetis sekaligus pemahaman tentang nilai-nilai kemanusiaan." },
            { question: "Aliran romantisme dalam cerita rekaan ditandai oleh kecenderungan pengarang untuk…", options: ["Menggambarkan kehidupan secara objektif dan apa adanya sesuai kenyataan", "Mengungkapkan perasaan, imajinasi, dan idealisme yang bebas dari aturan ketat", "Menampilkan kondisi sosial masyarakat bawah secara naturalistik", "Menggunakan simbol-simbol abstrak sebagai media ekspresi utama"], correctAnswer: 1, explanation: "Aliran romantisme ditandai oleh kebebasan ekspresi perasaan, imajinasi, dan idealisme pengarang." },
            { question: "Aliran naturalisme dalam cerita rekaan berbeda dari realisme karena naturalisme cenderung…", options: ["Memperindah kenyataan dengan sentuhan estetis yang tinggi", "Menggambarkan kenyataan secara ilmiah dan deterministik, termasuk sisi gelap kehidupan", "Menggunakan simbol-simbol untuk menyampaikan pesan tersembunyi", "Menampilkan situasi yang tidak masuk akal sebagai kritik sosial"], correctAnswer: 1, explanation: "Naturalisme menggambarkan kenyataan secara lebih ilmiah dan deterministik, menampilkan sisi gelap kehidupan tanpa penghalusan." },
            { question: "Cerita rekaan Melayu Klasik yang termasuk dalam kategori hikayat memiliki ciri khas berupa…", options: ["Tokoh manusia biasa yang menghadapi konflik sosial sehari-hari", "Alur cerita yang menggunakan teknik kilas balik secara dominan", "Tokoh raja, pahlawan, atau dewa dengan setting kerajaan dan peristiwa ajaib", "Penceritaan dari sudut pandang orang pertama yang realistis"], correctAnswer: 2, explanation: "Hikayat sebagai bentuk cerkan Melayu Klasik umumnya menampilkan tokoh raja, pahlawan, atau dewa dengan latar kerajaan dan nuansa ajaib atau magis." },
            { question: "Cerita rekaan prakemerdekaan Indonesia yang dipelopori Balai Pustaka umumnya mengangkat tema…", options: ["Perjuangan kemerdekaan melawan penjajah Belanda", "Konflik adat dan kawin paksa dalam masyarakat tradisional", "Industrialisasi dan modernisasi kota besar Indonesia", "Kritik terhadap sistem pemerintahan kolonial secara terbuka"], correctAnswer: 1, explanation: "Karya-karya Balai Pustaka pada masa prakemerdekaan umumnya mengangkat tema konflik adat, kawin paksa, dan pertentangan antara nilai tradisional dan modern." },
            { question: "Perbedaan mendasar antara cerpen dan novel terletak pada…", options: ["Jenis tema yang diangkat dalam cerita", "Aliran sastra yang menjadi acuan penulisan", "Panjang cerita, kompleksitas alur, dan kedalaman penokohan", "Latar tempat dan waktu yang digunakan dalam cerita"], correctAnswer: 2, explanation: "Perbedaan mendasar cerpen dan novel terletak pada panjang cerita, kompleksitas alur, jumlah tokoh, dan kedalaman penokohan." },
            { question: "Novel populer berbeda dari novel serius dalam hal…", options: ["Novel populer menggunakan bahasa yang lebih ilmiah dan formal", "Novel populer mengutamakan hiburan dan konsumsi massal, sedangkan novel serius mengutamakan nilai sastra dan perenungan mendalam", "Novel populer selalu memiliki ending yang tragis dan menyedihkan", "Novel populer ditulis oleh pengarang akademisi, sedangkan novel serius oleh sastrawan profesional"], correctAnswer: 1, explanation: "Novel populer berorientasi pada hiburan dan konsumsi massa dengan tema ringan, sementara novel serius mengutamakan nilai sastra, kompleksitas tema, dan perenungan mendalam." },
            { question: "Unsur intrinsik cerita rekaan yang mengatur urutan kejadian dalam cerita disebut…", options: ["Tema", "Amanat", "Alur (plot)", "Sudut pandang"], correctAnswer: 2, explanation: "Alur atau plot adalah unsur intrinsik yang mengatur urutan dan hubungan sebab-akibat kejadian-kejadian dalam cerita rekaan." },
            { question: "Unsur ekstrinsik cerita rekaan adalah unsur yang berada di luar karya sastra namun mempengaruhi penciptaannya, contohnya adalah…", options: ["Tema, alur, dan penokohan", "Latar, sudut pandang, dan gaya bahasa", "Latar belakang sosial pengarang, nilai budaya, dan kondisi zamannya", "Konflik, klimaks, dan resolusi cerita"], correctAnswer: 2, explanation: "Unsur ekstrinsik adalah unsur di luar teks yang mempengaruhi penciptaan cerkan, seperti latar belakang sosial pengarang, nilai budaya, ideologi, dan kondisi zaman." },
            { question: "Dalam apresiasi cerita rekaan, kegiatan membaca yang mendalam dan penuh penghayatan bertujuan untuk…", options: ["Mencari kesalahan ejaan dan tata bahasa dalam teks", "Menemukan fakta sejarah yang tersembunyi dalam cerita", "Memperoleh pengalaman estetis dan memahami nilai-nilai yang terkandung dalam karya", "Mengidentifikasi plagiarisme dari karya sastra sebelumnya"], correctAnswer: 2, explanation: "Membaca cerkan secara mendalam dalam konteks apresiasi bertujuan memperoleh pengalaman estetis dan memahami nilai-nilai kemanusiaan, moral, dan budaya dalam karya." },
            { question: "Dalam telaah struktural cerita rekaan, yang dimaksud dengan latar (setting) mencakup…", options: ["Hanya tempat terjadinya peristiwa dalam cerita", "Tempat, waktu, dan suasana sosial-budaya yang melingkupi cerita", "Urutan peristiwa dari awal hingga akhir cerita", "Hubungan antartokoh dalam cerita"], correctAnswer: 1, explanation: "Latar (setting) dalam telaah struktural mencakup tiga dimensi: latar tempat, latar waktu, dan latar sosial-budaya yang melingkupi jalannya cerita." },
            { question: "Sosiologi pengarang dalam telaah sosiologis cerita rekaan mengkaji…", options: ["Dampak karya sastra terhadap masyarakat pembaca", "Nilai-nilai sosial yang terkandung dalam teks karya sastra", "Posisi sosial pengarang, profesi, dan hubungannya dengan masyarakat serta karya yang dihasilkan", "Cara pembaca merespons dan memaknai karya sastra"], correctAnswer: 2, explanation: "Sosiologi pengarang mengkaji posisi sosial pengarang, profesi, latar belakang, ideologi, dan bagaimana faktor-faktor tersebut mempengaruhi karya yang dihasilkan." },
            { question: "Dalam kajian resepsi cerita rekaan, resensi cerkan merupakan kegiatan…", options: ["Membacakan cerkan di hadapan pendengar secara ekspresif", "Menulis ulang cerkan dengan perspektif yang berbeda", "Memberikan penilaian dan ulasan kritis terhadap suatu karya cerkan", "Menterjemahkan cerkan ke dalam bahasa lain"], correctAnswer: 2, explanation: "Resensi cerkan adalah kegiatan memberikan penilaian dan ulasan kritis terhadap suatu karya cerkan, mencakup kelebihan, kekurangan, dan relevansi karya tersebut." },
            { question: "Dalam kegiatan pembacaan cerita rekaan secara ekspresif, hal yang paling penting diperhatikan adalah…", options: ["Kecepatan membaca agar pendengar tidak bosan", "Penghayatan, intonasi, dan ekspresi yang sesuai dengan isi dan suasana cerita", "Penggunaan kostum yang sesuai dengan tokoh dalam cerita", "Hafalan teks agar pembacaan lebih lancar"], correctAnswer: 1, explanation: "Dalam pembacaan cerkan secara ekspresif, yang paling penting adalah penghayatan, intonasi yang tepat, dan ekspresi yang sesuai dengan isi, suasana, dan karakter tokoh dalam cerita." },
            { question: "Dalam reproduksi cerita rekaan, kegiatan tulis-ulang cerita (retelling) berbeda dari cerita-ulang karena tulis-ulang…", options: ["Dilakukan secara lisan di hadapan pendengar", "Mengubah alur cerita secara signifikan dengan kreativitas penulis", "Menyajikan kembali isi cerita dalam bentuk tulisan dengan bahasa sendiri namun tetap setia pada substansi aslinya", "Mengganti semua tokoh dengan tokoh-tokoh baru ciptaan penulis"], correctAnswer: 2, explanation: "Tulis-ulang cerita adalah kegiatan menyajikan kembali isi cerkan dalam bentuk tulisan menggunakan bahasa sendiri namun tetap setia pada substansi dan isi pokok cerita aslinya." }
          ]
        };

        // State Variables
        let selectedSubject = null;
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedAnswer = null;

        // DOM Elements
        const menuScreen = document.getElementById('menu-screen');
        const playingScreen = document.getElementById('playing-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const subjectGrid = document.getElementById('subject-grid');
        const playingSubjectTitle = document.getElementById('playing-subject-title');
        const playingProgressText = document.getElementById('playing-progress-text');
        const playingProgressBar = document.getElementById('playing-progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationContainer = document.getElementById('explanation-container');
        const explanationText = document.getElementById('explanation-text');
        const nextButtonContainer = document.getElementById('next-button-container');
        const nextButtonText = document.getElementById('next-button-text');
        const nextButtonIcon = document.getElementById('next-button-icon');

        // Initialization
        function init() {
            lucide.createIcons();
            renderMenu();
        }

        // --- RENDER MENU SCREEN ---
        function renderMenu() {
            subjectGrid.innerHTML = '';
            Object.keys(quizData).forEach(subject => {
                const btn = document.createElement('button');
                btn.onclick = () => startQuiz(subject);
                btn.className = "flex items-center p-4 border-2 border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all group w-full text-left bg-white";
                btn.innerHTML = `
                    <div class="bg-blue-100 p-3 rounded-lg text-blue-600 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                        <i data-lucide="book-marked" class="w-6 h-6"></i>
                    </div>
                    <span class="ml-4 text-lg font-medium text-slate-700 group-hover:text-blue-700">${subject}</span>
                `;
                subjectGrid.appendChild(btn);
            });
            
            lucide.createIcons();
            menuScreen.classList.remove('hidden');
            playingScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
        }

        // --- START QUIZ ---
        function startQuiz(subject) {
            selectedSubject = subject;
            currentQuestionIndex = 0;
            score = 0;
            selectedAnswer = null;

            menuScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            playingScreen.classList.remove('hidden');

            renderQuestion();
        }

        // --- RENDER QUESTION ---
        function renderQuestion() {
            selectedAnswer = null;
            const currentQuestionsList = quizData[selectedSubject];
            const currentQuestion = currentQuestionsList[currentQuestionIndex];
            const totalQuestions = currentQuestionsList.length;

            // Update Headers & Progress
            playingSubjectTitle.innerText = selectedSubject;
            playingProgressText.innerText = `Soal ${currentQuestionIndex + 1} dari ${totalQuestions}`;
            playingProgressBar.style.width = `${((currentQuestionIndex + 1) / totalQuestions) * 100}%`;

            // Update Texts
            questionText.innerText = currentQuestion.question;
            explanationText.innerText = currentQuestion.explanation;

            // Hide Explanation & Next button initially
            explanationContainer.classList.add('hidden');
            nextButtonContainer.classList.add('hidden');
            
            // Check if last question
            if (currentQuestionIndex < totalQuestions - 1) {
                nextButtonText.innerText = "Selanjutnya";
                nextButtonIcon.setAttribute('data-lucide', 'arrow-right');
            } else {
                nextButtonText.innerText = "Lihat Hasil";
                nextButtonIcon.setAttribute('data-lucide', 'trophy');
            }

            renderOptions();
            lucide.createIcons();
        }

        // --- RENDER OPTIONS ---
        function renderOptions() {
            const currentQuestion = quizData[selectedSubject][currentQuestionIndex];
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                
                // Determine styles based on answer state
                let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all flex items-start gap-4 ";
                let iconHTML = '';

                if (selectedAnswer === null) {
                    // Not answered yet
                    btnClass += "border-slate-200 hover:border-blue-500 hover:bg-blue-50 text-slate-700 cursor-pointer";
                    iconHTML = `<div class="w-6 h-6 rounded-full border-2 border-slate-300 flex-shrink-0 mt-0.5"></div>`;
                    btn.onclick = () => handleAnswerClick(index);
                } else {
                    // Answered
                    btn.disabled = true;
                    if (index === currentQuestion.correctAnswer) {
                        btnClass += "border-green-500 bg-green-50 text-green-800";
                        iconHTML = `<i data-lucide="check-circle-2" class="w-6 h-6 text-green-500 flex-shrink-0 mt-0.5"></i>`;
                    } else if (index === selectedAnswer) {
                        btnClass += "border-red-500 bg-red-50 text-red-800";
                        iconHTML = `<i data-lucide="x-circle" class="w-6 h-6 text-red-500 flex-shrink-0 mt-0.5"></i>`;
                    } else {
                        btnClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                        iconHTML = `<div class="w-6 h-6 rounded-full border-2 border-slate-200 flex-shrink-0 mt-0.5"></div>`;
                    }
                }

                btn.className = btnClass;
                btn.innerHTML = `${iconHTML}<span class="text-base">${option}</span>`;
                optionsContainer.appendChild(btn);
            });
            lucide.createIcons();
        }

        // --- HANDLE ANSWER ---
        function handleAnswerClick(index) {
            if (selectedAnswer !== null) return; // Prevent multiple clicks

            selectedAnswer = index;
            const currentQuestion = quizData[selectedSubject][currentQuestionIndex];

            if (index === currentQuestion.correctAnswer) {
                score++;
            }

            // Re-render options to show correctness
            renderOptions();

            // Show explanation & next button
            explanationContainer.classList.remove('hidden');
            nextButtonContainer.classList.remove('hidden');
        }

        // --- NEXT QUESTION ---
        function handleNextQuestion() {
            const totalQuestions = quizData[selectedSubject].length;
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResult();
            }
        }

        // --- RENDER RESULT SCREEN ---
        function showResult() {
            playingScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const totalQuestions = quizData[selectedSubject].length;
            const percentage = Math.round((score / totalQuestions) * 100);

            let message = "";
            if (percentage === 100) message = "Sempurna! Nilai A+ untukmu!";
            else if (percentage >= 80) message = "Luar biasa! Pemahamanmu sangat baik.";
            else if (percentage >= 60) message = "Cukup baik, tapi masih bisa ditingkatkan.";
            else message = "Jangan menyerah! Ayo pelajari modulnya lagi.";

            document.getElementById('result-subject').innerText = `Mata Kuliah: ${selectedSubject}`;
            document.getElementById('result-score-text').innerText = `${score}/${totalQuestions}`;
            document.getElementById('result-percentage').innerText = `Skor: ${percentage}%`;
            document.getElementById('result-message').innerText = message;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- RETURN TO MENU ---
        function returnToMenu() {
            selectedSubject = null;
            renderMenu();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Start the App
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
