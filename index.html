<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Mahasiswa Sastra</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex items-center justify-center p-4">

    <!-- SCREEN: MENU -->
    <div id="menu-screen" class="max-w-2xl w-full bg-white rounded-3xl shadow-xl overflow-hidden hidden">
        <div class="bg-blue-600 p-8 text-center text-white">
            <i data-lucide="book-open" class="w-16 h-16 mx-auto mb-4 opacity-90"></i>
            <h1 class="text-4xl font-bold mb-2">Kuis Mahasiswa Sastra</h1>
            <p class="text-blue-100">Uji pengetahuanmu di berbagai mata kuliah sastra & bahasa!</p>
        </div>
        <div class="p-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-6 text-center">Pilih Mata Kuliah:</h2>
            <div id="subject-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Subject buttons will be injected here -->
            </div>
        </div>
    </div>

    <!-- SCREEN: PLAYING -->
    <div id="playing-screen" class="max-w-3xl w-full h-fit bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col hidden my-10">
        <!-- Header / Progress -->
        <div class="bg-slate-800 p-6 flex flex-wrap gap-4 items-center justify-between text-white">
            <div class="flex items-center gap-3">
                <i data-lucide="book-marked" class="w-6 h-6 text-blue-400"></i>
                <h2 id="playing-subject-title" class="font-semibold text-lg"></h2>
            </div>
            <div id="playing-progress-text" class="bg-slate-700 px-4 py-1.5 rounded-full text-sm font-medium"></div>
        </div>
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-1.5">
            <div id="playing-progress-bar" class="bg-blue-500 h-1.5 transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Question Area -->
        <div class="p-8">
            <h3 id="question-text" class="text-xl md:text-2xl font-medium text-slate-800 leading-relaxed mb-8"></h3>

            <div id="options-container" class="space-y-3">
                <!-- Options will be injected here -->
            </div>

            <!-- Explanation Area -->
            <div id="explanation-container" class="mt-8 p-6 bg-blue-50 border border-blue-100 rounded-2xl animate-fade-in-up hidden">
                <h4 class="font-bold text-blue-800 flex items-center gap-2 mb-2">
                    <i data-lucide="book-open" class="w-5 h-5"></i>
                    Penjelasan
                </h4>
                <p id="explanation-text" class="text-blue-900 leading-relaxed"></p>
            </div>

            <!-- Action Button -->
            <div id="next-button-container" class="mt-8 flex justify-end hidden">
                <button onclick="handleNextQuestion()" id="next-button" class="flex items-center gap-2 px-8 py-3.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors">
                    <span id="next-button-text">Selanjutnya</span>
                    <i id="next-button-icon" data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- SCREEN: RESULT -->
    <div id="result-screen" class="max-w-lg w-full bg-white rounded-3xl shadow-xl p-8 text-center hidden">
        <div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i data-lucide="trophy" class="w-12 h-12 text-yellow-500"></i>
        </div>
        <h2 class="text-3xl font-bold text-slate-800 mb-2">Kuis Selesai!</h2>
        <p id="result-subject" class="text-slate-500 mb-8"></p>
        
        <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100">
            <div id="result-score-text" class="text-6xl font-bold text-blue-600 mb-2"></div>
            <p id="result-percentage" class="text-lg font-medium text-slate-700"></p>
            <p id="result-message" class="text-slate-500 mt-2"></p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button onclick="startQuiz(selectedSubject)" class="flex items-center justify-center gap-2 px-6 py-3 bg-blue-100 text-blue-700 font-semibold rounded-xl hover:bg-blue-200 transition-colors w-full sm:w-auto">
                <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                Ulangi Kuis
            </button>
            <button onclick="returnToMenu()" class="flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors w-full sm:w-auto">
                <i data-lucide="book-open" class="w-5 h-5"></i>
                Menu Utama
            </button>
        </div>
    </div>

    <!-- MAIN LOGIC -->
    <script>
        // Data Soal Lengkap
        const quizData = {
          "Teori Sastra": [
            { question: "Menurut kajian teori sastra, apakah yang dimaksud dengan sastra sebagai seni bahasa?", options: ["Sastra merupakan tulisan yang menggunakan bahasa baku dan formal dalam setiap karyanya", "Sastra adalah penggunaan bahasa secara kreatif dan imajinatif untuk mengungkapkan pengalaman manusia dengan nilai estetis", "Sastra adalah kumpulan teks yang hanya dapat dinikmati oleh kalangan akademis tertentu", "Sastra merupakan dokumen sejarah yang mencatat peristiwa nyata dalam kehidupan masyarakat"], correctAnswer: 1, explanation: "Sastra sebagai seni bahasa berarti penggunaan bahasa secara kreatif, imajinatif, dan estetis untuk mengungkapkan pengalaman manusia, bukan sekadar tulisan formal atau dokumen sejarah." },
            { question: "Dalam kajian aspek-aspek sastra (Modul 01 KB2), aspek intrinsik suatu karya sastra merujuk pada…", options: ["Pengaruh sosial dan budaya yang melatarbelakangi lahirnya karya sastra", "Unsur-unsur yang membangun karya sastra dari dalam, seperti tema, alur, dan gaya bahasa", "Biografi pengarang yang memengaruhi isi karya sastra", "Respons pembaca terhadap karya sastra yang dibaca"], correctAnswer: 1, explanation: "Aspek intrinsik adalah unsur-unsur yang membangun karya sastra dari dalam karya itu sendiri, seperti tema, alur, penokohan, latar, sudut pandang, dan gaya bahasa." },
            { question: "Proses kreatif penulisan karya sastra melibatkan tahapan yang disebut dengan inspirasi. Apa yang dimaksud dengan inspirasi dalam konteks penciptaan sastra?", options: ["Kemampuan teknis pengarang dalam menyusun kalimat yang indah", "Rangsangan atau dorongan awal yang memantik ide dan semangat pengarang untuk menciptakan karya", "Proses penyuntingan naskah sebelum diterbitkan kepada publik", "Penghargaan yang diterima pengarang atas karya yang telah dihasilkan"], correctAnswer: 1, explanation: "Inspirasi dalam proses kreatif adalah rangsangan atau dorongan awal (ide, gagasan) yang memantik semangat pengarang untuk menciptakan karya sastra." },
            { question: "Karakteristik bahasa sastra yang membedakannya dari bahasa sehari-hari adalah…", options: ["Bahasa sastra selalu menggunakan kata-kata ilmiah dan terminologi khusus", "Bahasa sastra bersifat denotatif dan langsung menunjuk pada makna sebenarnya", "Bahasa sastra kaya akan konotasi, ambiguitas, dan penggunaan majas untuk menciptakan efek estetis", "Bahasa sastra hanya menggunakan kosakata yang terdapat dalam kamus besar bahasa Indonesia"], correctAnswer: 2, explanation: "Bahasa sastra berbeda dari bahasa sehari-hari karena kaya akan makna konotatif, ambiguitas, dan penggunaan majas (metafora, simile, dll.) untuk menciptakan efek estetis dan emotif." },
            { question: "Dalam proses komunikasi sastra, unsur yang berperan sebagai penyampai pesan atau pengirim karya kepada pembaca disebut…", options: ["Narrator", "Pengarang (author)", "Protagonis", "Kritikus sastra"], correctAnswer: 1, explanation: "Dalam proses komunikasi sastra, pengarang (author) berperan sebagai pengirim atau komunikator yang menyampaikan pesan melalui karya sastranya kepada pembaca sebagai penerima." },
            { question: "Genre sastra secara umum dibagi menjadi tiga jenis utama. Manakah pembagian yang paling tepat?", options: ["Puisi, esai, dan biografi", "Puisi, prosa fiksi, dan drama", "Novel, cerpen, dan roman", "Lirik, epik, dan balada"], correctAnswer: 1, explanation: "Tiga genre utama sastra adalah puisi, prosa fiksi, dan drama. Ketiganya memiliki ciri khas masing-masing dalam hal bentuk, struktur, dan cara penyampaiannya." },
            { question: "Dalam kajian hakikat puisi (Modul 03 KB1), Samuel Taylor Coleridge mendefinisikan puisi sebagai…", options: ["Ungkapan spontan dari perasaan yang kuat", "Kata-kata terbaik dalam susunan terbaik (the best words in the best order)", "Ekspresi pikiran yang membangkitkan perasaan melalui imajinasi", "Tulisan yang berirama dan bermakna mendalam"], correctAnswer: 1, explanation: "Samuel Taylor Coleridge mendefinisikan puisi sebagai 'the best words in the best order' (kata-kata terbaik dalam susunan terbaik), menekankan pemilihan kata dan penataan yang cermat dalam puisi." },
            { question: "Puisi yang mengisahkan kepahlawanan atau petualangan seorang tokoh secara panjang dan epis disebut…", options: ["Puisi lirik", "Puisi dramatik", "Puisi epik", "Puisi didaktik"], correctAnswer: 2, explanation: "Puisi epik adalah jenis puisi yang mengisahkan kepahlawanan, petualangan, atau kejadian besar yang dialami seorang tokoh secara panjang, seperti Mahabharata dan Ramayana." },
            { question: "Dalam struktur puisi, yang dimaksud dengan diksi adalah…", options: ["Rima akhir yang digunakan dalam setiap baris puisi", "Pemilihan kata yang cermat dan tepat oleh penyair untuk menciptakan efek tertentu", "Jumlah suku kata dalam setiap baris puisi", "Tema sentral yang ingin disampaikan penyair melalui puisinya"], correctAnswer: 1, explanation: "Diksi dalam struktur puisi merujuk pada pemilihan kata yang cermat dan tepat oleh penyair untuk menciptakan efek estetis, emotif, dan makna yang diinginkan." },
            { question: "Dalam prosa fiksi (Modul 04 KB2), apa yang membedakan novel dengan cerpen?", options: ["Novel menggunakan sudut pandang orang pertama, sedangkan cerpen menggunakan sudut pandang orang ketiga", "Novel memiliki alur yang lebih kompleks, tokoh lebih banyak, dan cerita lebih panjang dibandingkan cerpen", "Novel selalu bertemakan percintaan, sedangkan cerpen dapat bertemakan apa saja", "Novel ditulis oleh penulis profesional, sedangkan cerpen dapat ditulis siapa saja"], correctAnswer: 1, explanation: "Perbedaan utama novel dan cerpen terletak pada panjang cerita, kompleksitas alur, jumlah tokoh, dan kedalaman pengembangan karakter. Novel lebih panjang dan kompleks dibandingkan cerpen." },
            { question: "Unsur alur (plot) dalam prosa fiksi terdiri atas beberapa tahapan. Tahapan di mana konflik mencapai puncak ketegangan disebut…", options: ["Eksposisi", "Komplikasi", "Klimaks", "Resolusi"], correctAnswer: 2, explanation: "Klimaks adalah tahapan dalam alur prosa fiksi di mana konflik mencapai puncak ketegangan tertinggi sebelum kemudian menurun menuju penyelesaian (resolusi/denoument)." },
            { question: "Hakikat drama yang membedakannya dari genre sastra lain adalah…", options: ["Drama hanya dapat dinikmati dalam bentuk tulisan naskah tanpa dipentaskan", "Drama dirancang untuk dipentaskan dan menggabungkan unsur sastra dengan seni pertunjukan", "Drama tidak memiliki tokoh dan dialog seperti prosa fiksi", "Drama hanya mengisahkan tragedi dan penderitaan manusia"], correctAnswer: 1, explanation: "Hakikat drama yang khas adalah bahwa drama dirancang untuk dipentaskan (performed), menggabungkan unsur sastra (teks/naskah) dengan seni pertunjukan (akting, tata panggung, musik, dll.)." },
            { question: "Dalam dimensi sastra, naskah drama memiliki ciri khas berupa…", options: ["Penggunaan narasi panjang untuk menggambarkan suasana dan perasaan tokoh", "Dialog antar tokoh sebagai unsur utama yang menggerakkan cerita, disertai petunjuk lakuan (stage direction)", "Penggunaan rima dan irama seperti dalam puisi", "Penceritaan dari sudut pandang orang pertama yang serba tahu"], correctAnswer: 1, explanation: "Naskah drama dicirikan oleh dialog antar tokoh sebagai unsur utama penggerak cerita, disertai petunjuk lakuan (stage direction/kramagung) yang mengarahkan pementasan." },
            { question: "Pendekatan mimetik dalam kajian sastra (Modul 06) memandang karya sastra sebagai…", options: ["Ekspresi jiwa dan perasaan pengarangnya semata", "Tiruan atau cerminan dari realitas kehidupan dan alam semesta", "Objek otonom yang bebas dari pengaruh pengarang dan pembaca", "Sarana untuk mencapai efek tertentu pada diri pembaca"], correctAnswer: 1, explanation: "Pendekatan mimetik memandang karya sastra sebagai mimesis (tiruan) atau cerminan dari realitas kehidupan dan alam semesta, berasal dari konsep Plato dan Aristoteles." },
            { question: "Teori strukturalisme dalam sastra (Modul 07 KB1) berfokus pada…", options: ["Pengaruh kondisi sosial masyarakat terhadap isi dan makna karya sastra", "Analisis struktur internal karya sastra sebagai sistem tanda yang otonom", "Pengaruh psikologi pengarang terhadap karya yang diciptakannya", "Respons dan interpretasi pembaca sebagai penentu makna karya sastra"], correctAnswer: 1, explanation: "Teori strukturalisme berfokus pada analisis struktur internal karya sastra sebagai sistem yang otonom, menelaah hubungan antar unsur dalam karya tanpa mengaitkannya dengan faktor eksternal." },
            { question: "Dalam teori resepsi sastra (Modul 08 KB1), konsep 'horizon harapan' (horizon of expectation) yang dikemukakan Hans Robert Jauss merujuk pada…", options: ["Tujuan pengarang dalam menciptakan karya sastranya", "Latar belakang budaya dan estetik pembaca yang memengaruhi cara mereka memahami dan menilai karya sastra", "Batas-batas tema yang boleh diangkat dalam karya sastra", "Standar teknis penulisan yang harus dipenuhi oleh setiap karya sastra"], correctAnswer: 1, explanation: "Horizon harapan (horizon of expectation) adalah konsep Jauss yang merujuk pada latar belakang estetik, budaya, dan pengalaman sastra pembaca yang memengaruhi cara mereka memahami, menginterpretasi, dan menilai sebuah karya sastra." },
            { question: "Teori ekokritik (Modul 09 KB3) dalam studi sastra bertujuan untuk…", options: ["Mengkaji pengaruh ekonomi pasar terhadap produksi dan distribusi karya sastra", "Menganalisis hubungan antara karya sastra dengan lingkungan alam dan isu-isu ekologi", "Meneliti ekosistem industri penerbitan sastra di berbagai negara", "Mengkaji evolusi dan perkembangan genre sastra dari masa ke masa"], correctAnswer: 1, explanation: "Teori ekokritik bertujuan menganalisis representasi lingkungan alam dalam karya sastra serta hubungan antara manusia dan alam yang tergambar dalam teks sastra, seiring meningkatnya kesadaran terhadap isu-isu ekologi." },
            { question: "Menurut teori sastra, karya sastra pada dasarnya merupakan tiruan atau representasi dari kehidupan nyata. Konsep ini dikenal dengan istilah…", options: ["Mimesis", "Katarsis", "Diksi", "Imajinatif"], correctAnswer: 0, explanation: "Mimesis adalah konsep yang dikemukakan Aristoteles yang menyatakan bahwa karya sastra merupakan peniruan atau representasi dari realitas kehidupan manusia." },
            { question: "Dalam kajian hakikat sastra, sastra dibedakan dari tulisan biasa karena memiliki sifat yang khas. Salah satu aspek penting yang membedakan sastra dari tulisan nonsastra adalah…", options: ["Menggunakan bahasa ilmiah yang baku", "Bersifat imajinatif, kreatif, dan estetis", "Selalu mengandung fakta sejarah yang akurat", "Ditulis hanya oleh kaum terpelajar"], correctAnswer: 1, explanation: "Sastra memiliki ciri khas bersifat imajinatif, kreatif, dan estetis yang membedakannya dari tulisan nonsastra seperti laporan ilmiah atau berita." },
            { question: "Proses kreatif penulisan karya sastra melibatkan beberapa tahap. Tahap awal yang sangat penting bagi seorang penulis adalah…", options: ["Proses revisi naskah secara berulang", "Penerbitan dan distribusi karya", "Penghayatan dan pengendapan pengalaman", "Penyusunan daftar pustaka"], correctAnswer: 2, explanation: "Dalam proses kreatif, tahap penghayatan dan pengendapan pengalaman merupakan tahap awal yang penting karena dari sinilah inspirasi dan gagasan kreatif seorang pengarang bermula." },
            { question: "Bahasa sastra memiliki karakteristik yang berbeda dari bahasa sehari-hari. Salah satu ciri khas bahasa sastra adalah penggunaan…", options: ["Bahasa denotatif yang lugas dan eksplisit", "Bahasa konotatif yang kaya makna kiasan", "Bahasa teknis yang bersifat terminologis", "Bahasa formal sesuai kaidah EYD semata"], correctAnswer: 1, explanation: "Bahasa sastra cenderung bersifat konotatif, yaitu mengandung makna tambahan, kiasan, dan perlambangan yang memperkaya ekspresi dan interpretasi pembaca." },
            { question: "Dalam proses komunikasi sastra, terdapat unsur-unsur yang terlibat. Unsur yang berperan sebagai penyampai pesan dalam komunikasi sastra adalah…", options: ["Pembaca", "Pengarang", "Penerbit", "Kritikus sastra"], correctAnswer: 1, explanation: "Dalam proses komunikasi sastra, pengarang berperan sebagai komunikator atau penyampai pesan (karya sastra) kepada pembaca sebagai komunikan." },
            { question: "Genre sastra secara umum dibagi menjadi tiga bentuk utama. Pembagian genre sastra tersebut adalah…", options: ["Lirik, epik, dan dramatik", "Roman, novel, dan cerpen", "Pantun, syair, dan gurindam", "Tragedi, komedi, dan melodrama"], correctAnswer: 0, explanation: "Secara tradisional, genre sastra dibagi menjadi tiga bentuk utama yaitu lirik (puisi), epik (prosa naratif), dan dramatik (drama)." },
            { question: "Dalam kajian hakikat puisi, puisi dibedakan dari prosa terutama karena puisi lebih mengutamakan…", options: ["Penceritaan tokoh secara kronologis", "Pemadatan bahasa dan kekuatan imaji", "Dialog antartokoh yang panjang", "Penjelasan latar tempat secara rinci"], correctAnswer: 1, explanation: "Puisi berbeda dari prosa karena puisi mengutamakan pemadatan bahasa, kekuatan imaji, ritme, dan musikalitas dalam mengekspresikan gagasan dan perasaan." },
            { question: "Dalam struktur puisi, terdapat unsur yang berkaitan dengan persajakan atau pengulangan bunyi di akhir baris. Unsur tersebut dikenal dengan istilah…", options: ["Rima", "Diksi", "Metafora", "Enjambemen"], correctAnswer: 0, explanation: "Rima adalah pengulangan bunyi yang terdapat di akhir baris-baris puisi yang menciptakan efek musikalitas dan keindahan bunyi dalam sebuah puisi." },
            { question: "Dalam kajian prosa fiksi, unsur yang berfungsi sebagai penggerak jalannya cerita dan menjadi inti dari konflik yang terjadi adalah…", options: ["Latar", "Sudut pandang", "Alur", "Gaya bahasa"], correctAnswer: 2, explanation: "Alur (plot) merupakan unsur prosa fiksi yang berfungsi sebagai penggerak jalannya cerita, mencakup rangkaian peristiwa dan konflik yang terstruktur dari awal hingga akhir cerita." },
            { question: "Salah satu ragam prosa fiksi yang memiliki ciri khas berupa cerita pendek dengan jumlah kata terbatas dan hanya mengisahkan satu peristiwa atau konflik tunggal adalah…", options: ["Novel", "Roman", "Cerita pendek (cerpen)", "Novela"], correctAnswer: 2, explanation: "Cerita pendek (cerpen) adalah ragam prosa fiksi yang memiliki ciri khas berupa cerita yang singkat, padat, dan hanya mengisahkan satu peristiwa atau konflik tunggal dengan jumlah kata yang terbatas." },
            { question: "Dalam dimensi sastra, drama memiliki kekhasan dibandingkan genre lain. Ciri utama yang membedakan naskah drama dari karya sastra lainnya adalah…", options: ["Dominasi narasi pengarang yang panjang", "Dominasi dialog antartokoh dan petunjuk pementasan", "Penggunaan bait dan larik seperti puisi", "Alur cerita yang selalu berakhir bahagia"], correctAnswer: 1, explanation: "Naskah drama memiliki ciri khas berupa dominasi dialog antartokoh dan petunjuk pementasan (stage direction) yang membedakannya dari genre prosa maupun puisi." },
            { question: "Drama sebagai seni pentas (teater) melibatkan berbagai unsur di luar teks. Unsur teater yang bertanggung jawab atas penafsiran naskah dan pengaturan keseluruhan pementasan disebut…", options: ["Aktor", "Dramaturg", "Sutradara", "Penata panggung"], correctAnswer: 2, explanation: "Sutradara adalah unsur penting dalam teater yang bertanggung jawab menafsirkan naskah drama dan mengatur keseluruhan proses pementasan dari aspek artistik hingga teknis." },
            { question: "Dalam pendekatan kajian sastra, pendekatan yang memusatkan perhatian pada teks sastra itu sendiri tanpa mempertimbangkan faktor eksternal seperti biografi pengarang disebut pendekatan…", options: ["Ekspresif", "Mimetik", "Pragmatik", "Objektif"], correctAnswer: 3, explanation: "Pendekatan objektif memusatkan perhatian pada karya sastra itu sendiri sebagai objek otonom tanpa mempertimbangkan faktor eksternal seperti pengarang, pembaca, atau realitas sosial." },
            { question: "Teori strukturalisme dalam kajian sastra menekankan bahwa makna sebuah karya sastra ditemukan melalui…", options: ["Latar belakang kehidupan pengarang", "Hubungan antarelemen dalam sistem karya itu sendiri", "Tanggapan emosional pembaca terhadap karya", "Konteks sosial dan budaya saat karya diciptakan"], correctAnswer: 1, explanation: "Teori strukturalisme menekankan bahwa makna dalam karya sastra ditemukan melalui hubungan dan relasi antarelemen atau struktur internal karya itu sendiri, bukan dari faktor di luar teks." },
            { question: "Teori resepsi sastra yang dikembangkan oleh Hans Robert Jauss menempatkan peranan penting pada…", options: ["Pengarang sebagai pencipta tunggal makna", "Teks sebagai struktur yang otonom", "Pembaca sebagai penentu makna karya sastra", "Konteks sosial sebagai sumber interpretasi"], correctAnswer: 2, explanation: "Teori resepsi sastra menempatkan pembaca pada posisi sentral sebagai penentu makna karya sastra. Hans Robert Jauss menekankan konsep 'horizon harapan' pembaca dalam proses pemaknaan karya." },
            { question: "Dalam teori semiotik, tanda (sign) terdiri dari dua komponen utama menurut Ferdinand de Saussure. Kedua komponen tersebut adalah…", options: ["Simbol dan ikon", "Penanda (signifier) dan petanda (signified)", "Denotasi dan konotasi", "Indeks dan simbol"], correctAnswer: 1, explanation: "Menurut Ferdinand de Saussure, tanda (sign) terdiri dari dua komponen yaitu penanda (signifier) yang merupakan citra bunyi, dan petanda (signified) yang merupakan konsep atau makna yang dikandung." },
            { question: "Teori ekokritik dalam kajian sastra berfokus pada…", options: ["Hubungan antara karya sastra dengan kondisi ekonomi masyarakat", "Representasi alam dan lingkungan hidup dalam karya sastra", "Pengaruh kolonialisme terhadap identitas pengarang", "Hubungan intertekstual antara karya sastra yang berbeda"], correctAnswer: 1, explanation: "Teori ekokritik merupakan pendekatan kajian sastra yang berfokus pada hubungan antara karya sastra dengan alam dan lingkungan hidup, termasuk bagaimana alam direpresentasikan dalam teks sastra." },
            { question: "Menurut teori sastra, karya sastra pada hakikatnya merupakan cerminan dari kehidupan manusia yang diungkapkan melalui…", options: ["Bahasa ilmiah yang bersifat denotatif dan objektif", "Bahasa yang bersifat estetis, imajinatif, dan ekspresif", "Data empiris yang dikumpulkan secara sistematis", "Fakta-fakta historis yang dicatat secara kronologis"], correctAnswer: 1, explanation: "Karya sastra menggunakan bahasa yang bersifat estetis, imajinatif, dan ekspresif untuk mengungkapkan pengalaman dan perasaan manusia, berbeda dengan bahasa ilmiah yang bersifat denotatif dan objektif." },
            { question: "Dalam aspek-aspek sastra, yang dimaksud dengan aspek dulce et utile pada karya sastra adalah…", options: ["Karya sastra harus bersifat indah sekaligus bermanfaat bagi pembaca", "Karya sastra hanya berfungsi sebagai hiburan semata", "Karya sastra wajib mengandung pesan moral yang berat", "Karya sastra harus ditulis dalam bahasa yang sulit dipahami"], correctAnswer: 0, explanation: "Konsep dulce et utile berasal dari Horatius yang berarti karya sastra harus menyenangkan (dulce/indah) sekaligus berguna atau bermanfaat (utile) bagi pembaca dan masyarakat." },
            { question: "Proses kreatif penulisan karya sastra pada umumnya diawali dengan tahap…", options: ["Penerbitan dan distribusi naskah kepada pembaca", "Revisi dan penyuntingan naskah secara menyeluruh", "Penemuan ide atau inspirasi yang kemudian diolah oleh pengarang", "Penilaian kritis oleh para ahli sastra"], correctAnswer: 2, explanation: "Proses kreatif penulisan karya sastra umumnya dimulai dari tahap penemuan ide atau inspirasi yang kemudian diolah melalui imajinasi dan kreativitas pengarang sebelum dituangkan dalam bentuk tulisan." },
            { question: "Karakteristik utama bahasa sastra yang membedakannya dari bahasa sehari-hari adalah penggunaan…", options: ["Istilah teknis dan terminologi ilmiah", "Kalimat pendek dan sederhana tanpa variasi", "Majas, simbol, dan ungkapan konotatif yang kaya makna", "Struktur gramatikal yang selalu baku dan formal"], correctAnswer: 2, explanation: "Bahasa sastra memiliki karakteristik khas berupa penggunaan majas (gaya bahasa), simbol-simbol, dan ungkapan konotatif yang kaya makna, sehingga memiliki keindahan dan kedalaman makna yang berbeda dari bahasa sehari-hari." },
            { question: "Dalam proses komunikasi sastra, pengarang berperan sebagai…", options: ["Penerima pesan yang memberikan tanggapan", "Pengirim pesan yang menyampaikan karya kepada pembaca", "Mediator antara penerbit dan pembaca", "Kritikus yang menilai kualitas karya sastra"], correctAnswer: 1, explanation: "Dalam proses komunikasi sastra, pengarang berposisi sebagai pengirim pesan (sender/encoder) yang menyampaikan gagasan, perasaan, dan pengalaman melalui karya sastra kepada pembaca sebagai penerima pesan." },
            { question: "Pembagian genre atau jenis karya sastra secara tradisional terdiri atas tiga jenis utama, yaitu…", options: ["Narasi, deskripsi, dan argumentasi", "Puisi, prosa, dan drama", "Novel, cerpen, dan esai", "Lirik, epik, dan balada"], correctAnswer: 1, explanation: "Secara tradisional, genre atau jenis karya sastra dibagi menjadi tiga jenis utama yaitu puisi, prosa, dan drama. Pembagian ini merupakan klasifikasi dasar yang digunakan dalam kajian sastra." },
            { question: "Hakikat puisi menurut Wordsworth adalah…", options: ["Karangan bebas yang mengutamakan logika dan fakta", "Ungkapan spontan dari perasaan yang kuat dan terlimpah", "Tiruan dari kehidupan nyata yang disajikan secara dramatis", "Cerita panjang yang ditulis dalam bentuk bait-bait"], correctAnswer: 1, explanation: "William Wordsworth mendefinisikan puisi sebagai 'spontaneous overflow of powerful feelings' yaitu ungkapan spontan dari perasaan yang kuat dan terlimpah, yang kemudian direnungkan kembali dalam ketenangan." },
            { question: "Jenis puisi yang termasuk dalam kategori puisi epik adalah…", options: ["Soneta dan haiku", "Elegi dan ode", "Epos dan balada", "Sajak bebas dan pantun"], correctAnswer: 2, explanation: "Puisi epik adalah jenis puisi naratif panjang yang menceritakan kisah kepahlawanan atau peristiwa besar. Epos (seperti Iliad dan Mahabharata) dan balada merupakan contoh puisi yang termasuk kategori puisi epik." },
            { question: "Dalam struktur puisi, yang dimaksud dengan rima adalah…", options: ["Jumlah suku kata dalam setiap baris puisi", "Persamaan bunyi pada akhir baris atau di dalam baris puisi", "Irama atau ritme yang dihasilkan dari tekanan kata", "Pilihan kata yang digunakan dalam puisi"], correctAnswer: 1, explanation: "Rima dalam struktur puisi merujuk pada persamaan atau perulangan bunyi (terutama vokal) pada akhir baris puisi atau di dalam baris puisi, yang menciptakan efek musikalitas dan keindahan bunyi." },
            { question: "Unsur intrinsik prosa fiksi yang mengacu pada cara pandang pengarang dalam menyampaikan cerita disebut…", options: ["Tema", "Alur", "Sudut pandang (point of view)", "Latar"], correctAnswer: 2, explanation: "Sudut pandang (point of view) adalah posisi atau cara pandang pengarang dalam menyampaikan cerita, misalnya sudut pandang orang pertama (aku), orang ketiga serba tahu, atau orang ketiga terbatas." },
            { question: "Perbedaan mendasar antara novel dan cerpen sebagai ragam prosa fiksi terletak pada…", options: ["Penggunaan bahasa dan gaya penulisan", "Jumlah tokoh dan kompleksitas permasalahan yang diangkat", "Tema yang boleh digunakan dalam karya", "Latar tempat dan waktu cerita"], correctAnswer: 1, explanation: "Perbedaan mendasar novel dan cerpen terletak pada panjang karya, jumlah tokoh, dan kompleksitas permasalahan. Novel lebih panjang dengan tokoh lebih banyak dan permasalahan lebih kompleks, sedangkan cerpen lebih singkat dan terfokus pada satu konflik utama." },
            { question: "Drama sebagai karya sastra memiliki ciri khas berupa adanya…", options: ["Narasi panjang yang disampaikan oleh pengarang", "Dialog antar tokoh sebagai medium penyampaian cerita", "Deskripsi latar yang sangat detail dan rinci", "Puisi-puisi yang disisipkan dalam alur cerita"], correctAnswer: 1, explanation: "Ciri khas drama sebagai karya sastra adalah penggunaan dialog antar tokoh sebagai medium utama penyampaian cerita, konflik, dan karakter. Dialog merupakan unsur fundamental yang membedakan drama dari genre sastra lainnya." },
            { question: "Teori strukturalisme dalam kajian sastra berfokus pada…", options: ["Pengaruh lingkungan sosial terhadap penciptaan karya sastra", "Hubungan antara karya sastra dengan pengarangnya", "Analisis unsur-unsur intrinsik yang membangun karya sastra secara mandiri", "Tanggapan dan reaksi pembaca terhadap karya sastra"], correctAnswer: 2, explanation: "Teori strukturalisme memandang karya sastra sebagai sebuah sistem yang otonom dan berfokus pada analisis unsur-unsur intrinsik (struktur) yang membangun karya sastra itu sendiri, tanpa mengaitkannya dengan faktor di luar teks." },
            { question: "Dalam teori sosiologi sastra, karya sastra dipandang sebagai…", options: ["Produk imajinasi murni yang bebas dari pengaruh sosial", "Cerminan dan dokumen sosial yang mencerminkan realitas masyarakat", "Sistem tanda yang bersifat otonom dan tertutup", "Ekspresi psikologi bawah sadar pengarangnya"], correctAnswer: 1, explanation: "Teori sosiologi sastra memandang karya sastra sebagai cerminan realitas sosial dan dokumen masyarakat yang mencerminkan kondisi, nilai, konflik, dan struktur sosial pada zamannya." },
            { question: "Teori resepsi sastra yang dikembangkan oleh Hans Robert Jauss menekankan pentingnya peran…", options: ["Pengarang dalam menentukan makna tunggal karya sastra", "Struktur teks dalam menghasilkan makna yang tetap", "Pembaca dan horizon harapan dalam pemaknaan karya sastra", "Konteks sejarah penciptaan karya sastra"], correctAnswer: 2, explanation: "Teori resepsi sastra Hans Robert Jauss menekankan peran aktif pembaca dan konsep 'horizon harapan' (horizon of expectation) dalam pemaknaan karya sastra, sehingga makna karya bersifat dinamis bergantung pada pembacanya." },
            { question: "Teori ekokritik dalam kajian sastra berfokus pada hubungan antara…", options: ["Karya sastra dengan struktur bahasa yang digunakannya", "Sastra dengan lingkungan alam dan isu-isu ekologi", "Teks sastra dengan konteks sosial budaya masyarakat", "Karya sastra dengan karya-karya sastra lain sebelumnya"], correctAnswer: 1, explanation: "Teori ekokritik merupakan pendekatan kajian sastra yang berfokus pada hubungan antara karya sastra dengan lingkungan alam, mengkaji bagaimana sastra merepresentasikan alam dan isu-isu ekologi serta kesadaran lingkungan hidup." }
          ],
          "Dasar-dasar Menulis": [
            { question: "Menulis merupakan kegiatan komunikasi yang bersifat tidak langsung karena…", options: ["Penulis dan pembaca berada di tempat yang sama", "Pesan disampaikan melalui lambang-lambang tertulis tanpa tatap muka langsung", "Penulis hanya menyampaikan pesan secara lisan", "Pembaca tidak perlu memahami maksud penulis"], correctAnswer: 1, explanation: "Menulis adalah bentuk komunikasi tidak langsung karena pesan disampaikan melalui lambang-lambang tertulis tanpa interaksi tatap muka antara penulis dan pembaca." },
            { question: "Dalam konsep menulis sebagai proses, tahap yang dilakukan penulis setelah menuangkan ide ke dalam tulisan disebut…", options: ["Prapenulisan", "Pengeditan", "Penulisan awal (drafting)", "Revisi"], correctAnswer: 3, explanation: "Setelah menuangkan ide dalam bentuk draf awal, penulis melakukan revisi yaitu tahap memperbaiki dan menyempurnakan tulisan sebelum menjadi produk akhir." },
            { question: "Diksi yang tepat adalah pemilihan kata yang mempertimbangkan…", options: ["Panjang pendeknya kata yang digunakan", "Ketepatan makna, kesesuaian konteks, dan keindahan kata", "Kata-kata asing agar terlihat ilmiah", "Jumlah suku kata dalam setiap kalimat"], correctAnswer: 1, explanation: "Diksi yang baik mencakup ketepatan makna, kesesuaian dengan konteks pemakaian, dan keindahan bunyi kata agar tulisan menjadi efektif dan komunikatif." },
            { question: "Penulisan kata depan 'di' yang benar menurut ejaan bahasa Indonesia adalah…", options: ["'di' selalu ditulis serangkai dengan kata yang mengikutinya", "'di' sebagai kata depan ditulis terpisah, sedangkan 'di' sebagai awalan ditulis serangkai", "'di' selalu ditulis terpisah dari kata yang mengikutinya", "'di' sebagai awalan ditulis terpisah dari kata kerjanya"], correctAnswer: 1, explanation: "Menurut ejaan bahasa Indonesia, 'di' sebagai kata depan (menunjukkan tempat) ditulis terpisah, sedangkan 'di-' sebagai awalan (membentuk kata kerja pasif) ditulis serangkai." },
            { question: "Kalimat efektif harus memenuhi syarat kesepadanan, yang berarti…", options: ["Kalimat menggunakan kata-kata yang bermakna sama", "Terdapat keseimbangan antara struktur bahasa dan jalan pikiran yang logis", "Setiap kalimat harus memiliki panjang yang sama", "Kalimat harus menggunakan diksi yang indah"], correctAnswer: 1, explanation: "Kesepadanan dalam kalimat efektif berarti adanya keseimbangan antara struktur bahasa dan gagasan atau jalan pikiran yang logis sehingga ide tersampaikan dengan tepat." },
            { question: "Perhatikan kalimat berikut: 'Para hadirin sekalian dipersilakan masuk.' Kalimat tersebut tidak efektif karena…", options: ["Menggunakan kata 'dipersilakan' yang tidak baku", "Terdapat pemborosan kata karena 'para' dan 'sekalian' bermakna jamak", "Tidak memiliki subjek yang jelas", "Kata 'hadirin' bukan merupakan kata baku"], correctAnswer: 1, explanation: "Kalimat tersebut tidak efektif karena terjadi pemborosan kata. Kata 'para' dan 'sekalian' keduanya sudah bermakna jamak, sehingga cukup digunakan salah satu saja." },
            { question: "Paragraf yang kalimat utamanya terletak di awal paragraf disebut paragraf…", options: ["Induktif", "Campuran", "Deduktif", "Naratif"], correctAnswer: 2, explanation: "Paragraf deduktif adalah paragraf yang kalimat utama atau gagasan pokoknya terletak di awal paragraf, kemudian diikuti kalimat-kalimat penjelas." },
            { question: "Dalam paragraf induktif, letak kalimat utama berada di…", options: ["Awal paragraf", "Tengah paragraf", "Akhir paragraf", "Awal dan akhir paragraf"], correctAnswer: 2, explanation: "Paragraf induktif dimulai dengan kalimat-kalimat penjelas yang berupa fakta atau detail, kemudian ditutup dengan kalimat utama yang berisi simpulan di akhir paragraf." },
            { question: "Wacana deskripsi bertujuan untuk…", options: ["Menceritakan urutan kejadian dari awal hingga akhir", "Menggambarkan suatu objek sehingga pembaca seolah-olah melihat, merasakan, atau mengalaminya", "Meyakinkan pembaca dengan bukti-bukti logis", "Mengajak pembaca melakukan sesuatu"], correctAnswer: 1, explanation: "Wacana deskripsi bertujuan melukiskan atau menggambarkan suatu objek secara rinci sehingga pembaca seolah-olah dapat melihat, merasakan, atau mengalami sendiri objek yang digambarkan." },
            { question: "Salah satu ciri utama wacana narasi adalah…", options: ["Menyajikan fakta dan data secara objektif", "Mengandung rangkaian peristiwa yang disusun secara kronologis", "Memberikan penilaian terhadap suatu objek", "Menjelaskan konsep secara sistematis"], correctAnswer: 1, explanation: "Wacana narasi ditandai dengan adanya rangkaian peristiwa atau kejadian yang disusun secara kronologis (berurutan berdasarkan waktu) dan biasanya melibatkan tokoh dan konflik." },
            { question: "Karangan eksposisi bertujuan untuk…", options: ["Mempengaruhi pembaca agar mengikuti pendapat penulis", "Menghibur pembaca melalui cerita yang menarik", "Memaparkan atau menjelaskan suatu informasi agar pembaca memahaminya", "Menggambarkan suatu objek dengan detail"], correctAnswer: 2, explanation: "Karangan eksposisi bertujuan memaparkan, menjelaskan, atau menguraikan suatu informasi, gagasan, atau konsep secara objektif agar pembaca mendapatkan pemahaman yang jelas." },
            { question: "Perbedaan utama antara karangan argumentasi dan persuasi terletak pada…", options: ["Cara penyajian data dan fakta", "Tujuan akhirnya; argumentasi bertujuan meyakinkan secara logis, persuasi bertujuan menggerakkan pembaca untuk bertindak", "Jenis topik yang dibahas", "Panjang karangan yang dihasilkan"], correctAnswer: 1, explanation: "Argumentasi bertujuan meyakinkan pembaca melalui alasan dan bukti-bukti logis, sedangkan persuasi bertujuan lebih jauh yaitu menggerakkan pembaca untuk melakukan tindakan tertentu sesuai keinginan penulis." },
            { question: "Dalam menilai karangan argumentasi, aspek yang paling penting untuk diperhatikan adalah…", options: ["Keindahan gaya bahasa yang digunakan", "Kekuatan dan kelogisan bukti serta argumen yang disajikan", "Panjang pendeknya karangan", "Penggunaan kata-kata asing dalam karangan"], correctAnswer: 1, explanation: "Penilaian karangan argumentasi yang paling utama adalah kekuatan dan kelogisan bukti serta argumen yang disampaikan penulis untuk meyakinkan pembaca." },
            { question: "Surat dinas berbeda dari surat pribadi karena surat dinas…", options: ["Ditulis menggunakan bahasa tidak resmi", "Tidak memerlukan kop surat", "Dibuat atas nama instansi atau lembaga resmi untuk keperluan kedinasan", "Tidak perlu menggunakan nomor surat"], correctAnswer: 2, explanation: "Surat dinas adalah surat yang dibuat atas nama instansi, lembaga, atau organisasi resmi untuk keperluan kedinasan, sehingga menggunakan bahasa resmi dan memiliki format baku." },
            { question: "Bagian surat dinas yang memuat tujuan atau isi singkat surat disebut…", options: ["Salam pembuka", "Kop surat", "Perihal", "Tembusan"], correctAnswer: 2, explanation: "Perihal (atau hal) dalam surat dinas adalah bagian yang memuat isi atau tujuan surat secara singkat sehingga penerima dapat langsung mengetahui pokok isi surat sebelum membaca seluruhnya." },
            { question: "Surat niaga yang dibuat untuk menyepakati hak dan kewajiban antara dua pihak dalam suatu transaksi disebut…", options: ["Surat penawaran", "Surat perjanjian", "Surat permintaan", "Surat pengiriman barang"], correctAnswer: 1, explanation: "Surat perjanjian adalah surat niaga yang memuat kesepakatan antara dua pihak atau lebih mengenai hak dan kewajiban masing-masing dalam suatu transaksi atau kerja sama bisnis." },
            { question: "Kerangka karangan berfungsi sebagai…", options: ["Produk akhir dari sebuah tulisan", "Panduan atau rencana sistematis yang membantu penulis mengorganisasi ide sebelum menulis", "Daftar kata-kata sulit yang akan digunakan dalam tulisan", "Ringkasan tulisan yang sudah selesai dibuat"], correctAnswer: 1, explanation: "Kerangka karangan berfungsi sebagai panduan atau rencana sistematis yang disusun sebelum menulis untuk membantu penulis mengorganisasi ide, menentukan urutan penyampaian, dan menjaga koherensi tulisan." },
            { question: "Menulis pada hakikatnya merupakan kegiatan yang bertujuan untuk…", options: ["Menyalin teks dari sumber lain secara verbatim", "Mengungkapkan gagasan, pikiran, dan perasaan melalui lambang-lambang grafis", "Menghafal kaidah tata bahasa secara sistematis", "Membaca dan memahami teks yang sudah ada"], correctAnswer: 1, explanation: "Hakikat menulis adalah kegiatan mengungkapkan gagasan, pikiran, perasaan, dan pengalaman melalui lambang-lambang grafis atau tulisan sehingga dapat dipahami oleh pembaca." },
            { question: "Dalam konsep menulis sebagai proses, tahapan yang dilakukan penulis sebelum mulai menulis draf adalah…", options: ["Revisi", "Editing", "Pramenulis (prewriting)", "Publikasi"], correctAnswer: 2, explanation: "Menulis sebagai proses terdiri atas beberapa tahap, dan tahap pertama adalah pramenulis (prewriting), yakni kegiatan persiapan sebelum menulis seperti menentukan topik, tujuan, dan mengumpulkan bahan." },
            { question: "Pemilihan kata yang tepat dan sesuai dengan makna yang ingin disampaikan dalam tulisan disebut…", options: ["Sintaksis", "Diksi", "Morfologi", "Fonologi"], correctAnswer: 1, explanation: "Diksi adalah pemilihan kata yang tepat dan sesuai untuk menyampaikan gagasan, sehingga tulisan menjadi jelas dan efektif dipahami pembaca." },
            { question: "Kata yang memiliki makna yang sama atau hampir sama disebut…", options: ["Antonim", "Homonim", "Sinonim", "Polisemi"], correctAnswer: 2, explanation: "Sinonim adalah kata-kata yang memiliki makna yang sama atau hampir sama, misalnya 'mati' dan 'meninggal'. Pemahaman sinonim penting dalam diksi agar penulis dapat memilih kata yang paling tepat." },
            { question: "Penulisan kata depan 'di' yang benar sesuai Ejaan Bahasa Indonesia (EBI) terdapat pada kalimat…", options: ["Buku itu diletakkan diatas meja", "Buku itu di letakkan di atas meja", "Buku itu diletakkan di atas meja", "Buku itu di letakkan diatas meja"], correctAnswer: 2, explanation: "Menurut EBI, 'di' sebagai awalan (menunjukkan bentuk pasif) ditulis serangkai dengan kata yang mengikutinya, sedangkan 'di' sebagai kata depan (menunjukkan tempat) ditulis terpisah. Jadi 'diletakkan' (pasif) serangkai dan 'di atas' (tempat) terpisah." },
            { question: "Salah satu syarat kalimat efektif adalah kesatuan, yang artinya…", options: ["Kalimat mengandung unsur-unsur yang berlebihan", "Kalimat memiliki satu ide pokok yang jelas dan hubungan antarunsur yang logis", "Kalimat menggunakan banyak kata penghubung", "Kalimat terdiri dari banyak anak kalimat"], correctAnswer: 1, explanation: "Kesatuan dalam kalimat efektif berarti kalimat tersebut memiliki satu ide pokok yang jelas dan setiap unsur dalam kalimat memiliki hubungan yang logis dan padu satu sama lain." },
            { question: "Kalimat berikut yang termasuk kalimat tidak efektif karena mengandung pemborosan kata adalah…", options: ["Ibu memasak nasi di dapur", "Para siswa-siswa mengerjakan soal ujian", "Guru menjelaskan materi dengan jelas", "Adik membaca buku di kamar"], correctAnswer: 1, explanation: "'Para siswa-siswa' adalah pemborosan kata karena 'para' sudah menunjukkan jamak, sehingga tidak perlu diulang menjadi 'siswa-siswa'. Kalimat efektif seharusnya 'Para siswa mengerjakan soal ujian'." },
            { question: "Paragraf yang kalimat utamanya terletak di awal paragraf disebut paragraf…", options: ["Induktif", "Campuran", "Deduktif", "Naratif"], correctAnswer: 2, explanation: "Paragraf deduktif adalah paragraf yang kalimat utama atau gagasan pokok diletakkan di awal paragraf, kemudian diikuti oleh kalimat-kalimat penjelas." },
            { question: "Pada paragraf induktif, kalimat utama diletakkan di…", options: ["Awal paragraf", "Tengah paragraf", "Akhir paragraf", "Awal dan akhir paragraf"], correctAnswer: 2, explanation: "Paragraf induktif adalah paragraf yang dimulai dengan kalimat-kalimat penjelas terlebih dahulu, kemudian diakhiri dengan kalimat utama atau kesimpulan di bagian akhir paragraf." },
            { question: "Karangan deskripsi bertujuan untuk…", options: ["Menceritakan urutan kejadian atau peristiwa berdasarkan waktu", "Melukiskan atau menggambarkan suatu objek sehingga pembaca seolah-olah dapat melihat, mendengar, atau merasakan objek tersebut", "Memaparkan fakta dan data secara sistematis untuk menambah pengetahuan pembaca", "Mempengaruhi pembaca agar mengikuti pendapat penulis"], correctAnswer: 1, explanation: "Wacana deskripsi bertujuan melukiskan atau menggambarkan suatu objek, tempat, atau suasana secara rinci sehingga pembaca seolah-olah dapat melihat, mendengar, atau merasakan langsung apa yang digambarkan penulis." },
            { question: "Ciri khas wacana narasi yang membedakannya dari jenis wacana lain adalah…", options: ["Adanya urutan peristiwa berdasarkan dimensi waktu", "Adanya penggambaran objek secara rinci dan detail", "Adanya upaya mempengaruhi sikap dan pendapat pembaca", "Adanya pemaparan fakta dan data secara sistematis"], correctAnswer: 0, explanation: "Narasi adalah wacana yang menceritakan rangkaian peristiwa atau kejadian secara kronologis atau berdasarkan urutan waktu. Unsur waktu menjadi ciri khas utama yang membedakan narasi dari jenis wacana lainnya." },
            { question: "Karangan eksposisi bertujuan utama untuk…", options: ["Menghibur pembaca dengan cerita yang menarik", "Membujuk pembaca agar mau melakukan sesuatu", "Memberikan informasi, penjelasan, dan pemahaman kepada pembaca", "Menggambarkan suatu objek secara imajinatif"], correctAnswer: 2, explanation: "Eksposisi adalah jenis karangan yang bertujuan memberikan informasi, penjelasan, dan pemahaman kepada pembaca tentang suatu topik atau masalah secara jelas dan objektif." },
            { question: "Perbedaan utama antara karangan argumentasi dan persuasi adalah…", options: ["Argumentasi menggunakan data, sedangkan persuasi tidak menggunakan data sama sekali", "Argumentasi bertujuan meyakinkan pembaca melalui bukti dan alasan logis, sedangkan persuasi bertujuan mempengaruhi dan menggerakkan pembaca untuk bertindak", "Persuasi hanya digunakan dalam iklan, sedangkan argumentasi hanya digunakan dalam karya ilmiah", "Argumentasi bersifat subjektif, sedangkan persuasi bersifat objektif"], correctAnswer: 1, explanation: "Argumentasi bertujuan meyakinkan pembaca bahwa pendapat penulis benar melalui bukti dan alasan yang logis, sedangkan persuasi bertujuan mempengaruhi dan menggerakkan pembaca untuk melakukan atau mempercayai sesuatu." },
            { question: "Surat dinas berbeda dari surat pribadi terutama dalam hal…", options: ["Penggunaan bahasa yang santai dan akrab", "Tidak memerlukan kop surat dan nomor surat", "Menggunakan bahasa resmi dan dikeluarkan oleh instansi atau lembaga resmi", "Isi surat bersifat sangat personal dan rahasia"], correctAnswer: 2, explanation: "Surat dinas adalah surat yang dikeluarkan oleh instansi atau lembaga resmi (pemerintah maupun swasta) yang menggunakan bahasa resmi dan formal, dilengkapi dengan kop surat, nomor surat, dan cap/stempel resmi." },
            { question: "Bagian surat dinas yang berisi nama dan alamat instansi atau lembaga pengirim disebut…", options: ["Perihal surat", "Kop surat (kepala surat)", "Tembusan", "Lampiran"], correctAnswer: 1, explanation: "Kop surat atau kepala surat adalah bagian surat dinas yang terletak di bagian atas surat dan memuat nama instansi, alamat, nomor telepon, dan logo atau lambang instansi pengirim." },
            { question: "Surat niaga yang dibuat untuk menyampaikan penawaran barang atau jasa kepada calon pembeli disebut…", options: ["Surat pengaduan", "Surat pesanan", "Surat penawaran", "Surat konfirmasi"], correctAnswer: 2, explanation: "Surat penawaran adalah surat niaga yang dikirimkan oleh penjual kepada calon pembeli untuk menyampaikan informasi tentang barang atau jasa yang ditawarkan beserta harga dan syarat-syaratnya." },
            { question: "Dalam perencanaan tulisan, kerangka karangan (outline) berfungsi sebagai…", options: ["Draf akhir tulisan yang siap dipublikasikan", "Pedoman atau panduan dalam mengembangkan tulisan agar sistematis dan terarah", "Catatan referensi dari sumber-sumber yang dikutip", "Ringkasan isi tulisan untuk pembaca"], correctAnswer: 1, explanation: "Kerangka karangan (outline) berfungsi sebagai pedoman atau panduan bagi penulis dalam mengembangkan tulisan agar tersusun secara sistematis, logis, dan terarah sehingga tulisan tidak menyimpang dari topik yang telah ditentukan." },
            { question: "Menulis pada hakikatnya merupakan kegiatan yang bertujuan untuk…", options: ["Mengungkapkan gagasan secara lisan kepada pendengar", "Menyampaikan pesan atau informasi melalui lambang-lambang grafis kepada pembaca", "Menghafal berbagai aturan tata bahasa yang berlaku", "Membaca dan memahami teks yang telah tersedia"], correctAnswer: 1, explanation: "Hakikat menulis adalah kegiatan menyampaikan pesan, gagasan, atau informasi kepada pembaca melalui lambang-lambang grafis (tulisan), bukan secara lisan." },
            { question: "Dalam konsep menulis sebagai proses, tahap yang dilakukan penulis setelah selesai menulis draf adalah…", options: ["Prapenulisan (prewriting)", "Pengeditan dan revisi", "Pemilihan topik", "Pembuatan outline awal"], correctAnswer: 1, explanation: "Menulis sebagai proses terdiri atas prapenulisan, penulisan draf, dan pascapenulisan (revisi/pengeditan). Setelah draf selesai, penulis melakukan pengeditan dan revisi untuk menyempurnakan tulisan." },
            { question: "Diksi dalam penulisan mengacu pada…", options: ["Penggunaan tanda baca yang tepat dalam kalimat", "Pemilihan kata yang tepat dan sesuai konteks untuk menyampaikan gagasan", "Penyusunan paragraf secara logis dan sistematis", "Penentuan jenis karangan yang akan ditulis"], correctAnswer: 1, explanation: "Diksi adalah pilihan kata yang tepat dan sesuai untuk menyampaikan gagasan. Diksi mencakup ketepatan, kecermatan, dan keserasian penggunaan kata dalam konteks tertentu." },
            { question: "Penulisan kata 'di' yang benar sebagai preposisi (kata depan) terdapat pada kalimat…", options: ["Buku itu diambil oleh adik dari diatas meja", "Dia duduk di kursi paling depan ruangan", "Laporan itu sudah diketik dan dicetak", "Pekerjaan itu dikerjakan dengan baik olehnya"], correctAnswer: 1, explanation: "'Di' sebagai kata depan (preposisi) ditulis terpisah dari kata yang mengikutinya, contohnya 'di kursi'. Sedangkan 'di-' sebagai awalan (prefiks) ditulis serangkai seperti 'diambil', 'diketik', 'dikerjakan'." },
            { question: "Kalimat efektif adalah kalimat yang mampu…", options: ["Menggunakan kata-kata yang panjang dan kompleks", "Menyampaikan gagasan penulis secara tepat sehingga pembaca memahaminya sesuai maksud penulis", "Memiliki jumlah kata yang sebanyak-banyaknya untuk kejelasan", "Mengandung unsur subjek, predikat, objek, dan keterangan sekaligus"], correctAnswer: 1, explanation: "Kalimat efektif adalah kalimat yang dapat menyampaikan gagasan penulis secara tepat kepada pembaca sehingga pembaca memahami maksud penulis dengan benar, bukan semata-mata panjang atau memuat semua unsur kalimat." },
            { question: "Salah satu syarat kalimat efektif adalah kehematan, yang berarti…", options: ["Menggunakan kata-kata yang bermakna denotatif saja", "Tidak menggunakan kata-kata yang mubazir atau pengulangan yang tidak perlu", "Menyusun kalimat dengan pola S-P-O-K secara lengkap", "Menggunakan pilihan kata yang bervariasi dalam setiap kalimat"], correctAnswer: 1, explanation: "Kehematan dalam kalimat efektif berarti menghindari penggunaan kata-kata yang mubazir, berulang tanpa tujuan, atau tidak fungsional, sehingga kalimat menjadi ringkas namun tetap jelas." },
            { question: "Paragraf yang baik harus memiliki kesatuan (unity), artinya…", options: ["Mengandung minimal tiga kalimat penjelas yang berbeda topik", "Semua kalimat dalam paragraf membicarakan satu gagasan pokok yang sama", "Setiap kalimat dalam paragraf menggunakan kata penghubung yang bervariasi", "Paragraf diawali dengan kalimat pertanyaan dan diakhiri dengan kalimat simpulan"], correctAnswer: 1, explanation: "Kesatuan (unity) dalam paragraf berarti seluruh kalimat yang ada dalam paragraf tersebut hanya membicarakan satu gagasan pokok, tidak melebar ke topik lain." },
            { question: "Paragraf induktif adalah paragraf yang…", options: ["Menempatkan kalimat utama di awal paragraf", "Menempatkan kalimat utama di tengah paragraf", "Menempatkan kalimat utama di akhir paragraf", "Tidak memiliki kalimat utama yang jelas"], correctAnswer: 2, explanation: "Paragraf induktif adalah paragraf yang dimulai dengan kalimat-kalimat penjelas dan diakhiri dengan kalimat utama (simpulan) di bagian akhir paragraf, berbeda dengan paragraf deduktif yang menempatkan kalimat utama di awal." },
            { question: "Wacana deskripsi bertujuan untuk…", options: ["Meyakinkan pembaca agar mengikuti pendapat penulis", "Menceritakan rangkaian peristiwa secara kronologis", "Melukiskan atau menggambarkan objek sehingga pembaca seolah-olah melihat sendiri objek tersebut", "Menjelaskan suatu proses atau cara kerja sesuatu"], correctAnswer: 2, explanation: "Wacana deskripsi bertujuan menggambarkan atau melukiskan objek (benda, tempat, orang, suasana) secara rinci sehingga pembaca seolah-olah dapat melihat, merasakan, atau mengalami sendiri objek yang digambarkan." },
            { question: "Ciri khas wacana narasi yang membedakannya dari jenis wacana lain adalah…", options: ["Mengandung argumen-argumen yang logis untuk meyakinkan pembaca", "Mengandung rangkaian peristiwa yang disusun secara kronologis dengan unsur waktu yang jelas", "Menggambarkan objek secara detail dengan menggunakan panca indera", "Menjelaskan suatu konsep atau proses secara sistematis dan objektif"], correctAnswer: 1, explanation: "Wacana narasi dicirikan oleh adanya rangkaian peristiwa yang disusun berdasarkan urutan waktu (kronologis) dengan unsur-unsur seperti tokoh, alur, latar, dan konflik." },
            { question: "Karangan eksposisi berbeda dari karangan deskripsi karena eksposisi…", options: ["Mengandung unsur imajinasi dan kreativitas penulis", "Bertujuan menjelaskan, memaparkan, atau memberikan informasi secara objektif kepada pembaca", "Mengandalkan penggambaran detail melalui pancaindra", "Berfokus pada urutan waktu kejadian suatu peristiwa"], correctAnswer: 1, explanation: "Karangan eksposisi bertujuan menjelaskan, memaparkan, dan memberikan informasi atau pengetahuan kepada pembaca secara objektif, sedangkan deskripsi lebih bertujuan melukiskan objek agar pembaca merasakan sendiri." },
            { question: "Karangan argumentasi yang baik harus didukung oleh…", options: ["Kalimat-kalimat yang panjang dan penuh kata kiasan", "Bukti, data, fakta, atau alasan yang logis untuk memperkuat pendapat penulis", "Ajakan langsung kepada pembaca untuk melakukan sesuatu", "Deskripsi yang mendetail tentang latar tempat dan waktu"], correctAnswer: 1, explanation: "Karangan argumentasi bertujuan meyakinkan pembaca tentang suatu pendapat, sehingga harus didukung bukti, data, fakta, atau alasan yang logis dan kuat agar simpulan dapat diterima pembaca." },
            { question: "Perbedaan utama antara karangan persuasi dan argumentasi adalah…", options: ["Argumentasi menggunakan data, sedangkan persuasi tidak menggunakan data sama sekali", "Persuasi bertujuan mengajak atau mempengaruhi pembaca untuk bertindak, sedangkan argumentasi bertujuan meyakinkan secara logis", "Persuasi hanya digunakan dalam iklan, sedangkan argumentasi digunakan dalam karya ilmiah", "Argumentasi bersifat subjektif, sedangkan persuasi bersifat objektif"], correctAnswer: 1, explanation: "Persuasi bertujuan mengajak, membujuk, atau mempengaruhi pembaca untuk melakukan sesuatu, sedangkan argumentasi lebih bertujuan meyakinkan pembaca tentang kebenaran suatu pendapat melalui penalaran logis." },
            { question: "Surat dinas memiliki ciri khas dibandingkan surat pribadi, yaitu…", options: ["Menggunakan bahasa yang santai dan akrab", "Ditulis atas nama lembaga atau instansi resmi dan menggunakan bahasa formal", "Tidak memerlukan kop surat dan nomor surat", "Hanya ditujukan kepada individu, bukan instansi lain"], correctAnswer: 1, explanation: "Surat dinas ditulis atas nama lembaga atau instansi resmi, menggunakan bahasa formal/baku, dilengkapi kop surat, nomor surat, cap/stempel, dan tandatangan pejabat yang berwenang." },
            { question: "Surat niaga yang berfungsi sebagai respons terhadap penawaran barang dari pihak penjual disebut…", options: ["Surat penawaran", "Surat pesanan (order)", "Surat pengiriman barang", "Surat klaim"], correctAnswer: 1, explanation: "Surat pesanan (order) adalah surat niaga yang dikirimkan oleh calon pembeli sebagai respons terhadap penawaran yang diterima dari pihak penjual, berisi permintaan untuk membeli sejumlah barang atau jasa tertentu." },
            { question: "Kerangka karangan (outline) dalam perencanaan tulisan berfungsi untuk…", options: ["Menggantikan proses penulisan draf karangan secara keseluruhan", "Memandu penulis agar tulisan berkembang secara sistematis, teratur, dan tidak keluar dari topik", "Menentukan gaya bahasa yang akan digunakan dalam karangan", "Mempercepat proses editing dan revisi setelah karangan selesai ditulis"], correctAnswer: 1, explanation: "Kerangka karangan berfungsi sebagai panduan atau peta tulisan yang membantu penulis mengembangkan gagasan secara sistematis dan teratur, menghindari penyimpangan dari topik, serta menjaga keruntutan dan kelengkapan isi karangan." }
          ],
          "Dasar-dasar Membaca": [
            { question: "Membaca pada hakikatnya merupakan suatu proses yang bersifat kompleks karena melibatkan berbagai aspek. Manakah pernyataan yang paling tepat menggambarkan hakikat membaca?", options: ["Membaca adalah kegiatan melafalkan lambang-lambang bunyi bahasa secara nyaring", "Membaca adalah proses konstruktif yang melibatkan interaksi antara pembaca, teks, dan konteks untuk membangun makna", "Membaca adalah kegiatan melihat dan menghafal isi teks tertulis", "Membaca adalah kemampuan mengenali huruf dan kata-kata dalam teks"], correctAnswer: 1, explanation: "Hakikat membaca bukan sekadar melafalkan atau menghafal, melainkan proses konstruktif yang melibatkan interaksi antara pembaca, teks, dan konteks sehingga terbentuk makna yang bermakna bagi pembaca." },
            { question: "Dalam proses membaca, terdapat tahap-tahap yang perlu dilalui oleh pembaca. Urutan tahap kegiatan membaca yang benar adalah…", options: ["Prabaca, saat baca, pascabaca", "Saat baca, prabaca, pascabaca", "Prabaca, pascabaca, saat baca", "Pascabaca, saat baca, prabaca"], correctAnswer: 0, explanation: "Tahap kegiatan membaca meliputi tiga tahap secara berurutan, yaitu tahap prabaca (persiapan sebelum membaca), tahap saat baca (proses membaca berlangsung), dan tahap pascabaca (kegiatan setelah membaca untuk memperkuat pemahaman)." },
            { question: "Pada tahap prabaca, kegiatan yang sebaiknya dilakukan oleh pembaca adalah…", options: ["Membuat ringkasan isi bacaan", "Mengajukan pertanyaan tentang isi bacaan yang telah dibaca", "Mengaktifkan pengetahuan awal dan membuat prediksi tentang isi teks", "Mengevaluasi informasi yang diperoleh dari teks"], correctAnswer: 2, explanation: "Pada tahap prabaca, pembaca sebaiknya mengaktifkan pengetahuan awal (prior knowledge) dan membuat prediksi tentang isi teks berdasarkan judul, gambar, atau petunjuk lain agar lebih siap memahami teks." },
            { question: "Faktor internal yang memengaruhi kemampuan membaca seseorang adalah…", options: ["Ketersediaan bahan bacaan di perpustakaan", "Kondisi fisik, motivasi, dan minat baca pembaca", "Dukungan keluarga dalam menyediakan buku", "Kualitas pengajaran membaca di sekolah"], correctAnswer: 1, explanation: "Faktor internal adalah faktor yang berasal dari dalam diri pembaca, meliputi kondisi fisik (kesehatan, penglihatan), motivasi, minat baca, dan kemampuan kognitif, sedangkan faktor lainnya bersifat eksternal." },
            { question: "Salah satu faktor eksternal yang dapat memengaruhi kemampuan membaca seseorang adalah…", options: ["Tingkat kecerdasan pembaca", "Kondisi emosional saat membaca", "Kebisingan lingkungan tempat membaca", "Daya ingat jangka panjang pembaca"], correctAnswer: 2, explanation: "Faktor eksternal berasal dari luar diri pembaca. Kebisingan lingkungan tempat membaca merupakan faktor eksternal yang dapat mengganggu konsentrasi dan menurunkan kemampuan membaca seseorang." },
            { question: "Cara yang paling efektif untuk mengatasi pengaruh buruk faktor internal dalam membaca adalah…", options: ["Memilih tempat membaca yang tenang dan nyaman", "Meningkatkan motivasi dan minat baca melalui pemilihan bahan bacaan yang sesuai minat", "Menggunakan pencahayaan yang memadai saat membaca", "Meminta bantuan orang lain untuk membacakan teks"], correctAnswer: 1, explanation: "Untuk mengatasi pengaruh buruk faktor internal seperti rendahnya motivasi, cara yang tepat adalah meningkatkan motivasi dan minat baca dengan memilih bahan bacaan yang sesuai dengan minat pembaca sehingga proses membaca lebih menyenangkan." },
            { question: "Pemahaman literal dalam membaca merujuk pada kemampuan…", options: ["Memahami makna tersirat yang tidak dinyatakan secara eksplisit dalam teks", "Menghubungkan isi teks dengan pengalaman dan pengetahuan pembaca", "Memahami informasi yang secara tersurat (eksplisit) dinyatakan dalam teks", "Menilai dan mengevaluasi kualitas isi teks secara kritis"], correctAnswer: 2, explanation: "Pemahaman literal adalah tingkat pemahaman yang paling dasar, yaitu kemampuan memahami informasi yang secara eksplisit atau tersurat dinyatakan dalam teks tanpa perlu menafsirkan lebih jauh." },
            { question: "Kemampuan pembaca untuk menyimpulkan informasi yang tidak secara langsung dinyatakan dalam teks merupakan bentuk pemahaman…", options: ["Literal", "Interpretatif", "Kritis", "Kreatif"], correctAnswer: 1, explanation: "Pemahaman interpretatif adalah kemampuan pembaca untuk menyimpulkan, menafsirkan, dan memahami makna tersirat yang tidak dinyatakan secara eksplisit dalam teks, melibatkan proses inferensi dan penalaran." },
            { question: "Membaca intensif adalah jenis membaca yang bertujuan untuk…", options: ["Membaca teks sebanyak mungkin dalam waktu singkat", "Memperoleh pemahaman mendalam dan terperinci terhadap isi teks", "Memperoleh gambaran umum tentang isi teks secara sekilas", "Menikmati keindahan bahasa dalam teks sastra"], correctAnswer: 1, explanation: "Membaca intensif bertujuan untuk memperoleh pemahaman yang mendalam, terperinci, dan komprehensif terhadap isi teks, sehingga pembaca benar-benar memahami setiap bagian teks secara menyeluruh." },
            { question: "Strategi SQ3R merupakan salah satu strategi yang digunakan dalam membaca intensif. Huruf R yang pertama dalam SQ3R singkatan dari…", options: ["Review", "Read", "Recite", "Respond"], correctAnswer: 1, explanation: "SQ3R adalah singkatan dari Survey, Question, Read, Recite, dan Review. Huruf R pertama adalah Read (membaca), yaitu tahap membaca teks secara menyeluruh dengan tujuan menjawab pertanyaan yang telah dirumuskan sebelumnya." },
            { question: "Membaca ekstensif berbeda dengan membaca intensif. Ciri utama membaca ekstensif adalah…", options: ["Membaca teks secara mendalam kata per kata", "Membaca bahan bacaan dalam jumlah banyak dengan tujuan memperoleh pemahaman umum", "Membaca teks dengan memperhatikan setiap detail informasi", "Membaca teks dengan cara mengulang-ulang bagian yang sulit"], correctAnswer: 1, explanation: "Membaca ekstensif ditandai dengan membaca bahan bacaan dalam jumlah banyak dan beragam dengan tujuan utama memperoleh pemahaman umum tentang berbagai topik, bukan memahami secara mendalam setiap detail teks." },
            { question: "Salah satu strategi membaca ekstensif yang bertujuan untuk memperoleh gambaran umum isi teks dengan cara melihat sekilas judul, subjudul, dan paragraf pertama serta terakhir disebut…", options: ["Skimming", "Scanning", "SQ3R", "Speed reading"], correctAnswer: 0, explanation: "Skimming adalah strategi membaca cepat untuk memperoleh gambaran umum atau ide pokok teks dengan cara melihat sekilas judul, subjudul, kalimat pertama dan terakhir paragraf, serta kata-kata kunci tanpa membaca seluruh teks." },
            { question: "Kecepatan membaca yang ideal bagi pembaca dewasa yang terlatih umumnya adalah…", options: ["100-150 kata per menit", "200-250 kata per menit", "250-350 kata per menit", "500-600 kata per menit"], correctAnswer: 2, explanation: "Kecepatan membaca yang ideal bagi pembaca dewasa yang terlatih umumnya berada pada kisaran 250-350 kata per menit dengan tingkat pemahaman yang memadai. Kecepatan ini dianggap efisien untuk keperluan membaca sehari-hari." },
            { question: "Dalam era digital, konsep literasi digital mencakup kemampuan untuk…", options: ["Hanya mampu mengoperasikan perangkat komputer dan telepon pintar", "Mengakses, mengevaluasi, dan menggunakan informasi secara kritis dan etis di media digital", "Membaca teks digital lebih cepat dibandingkan teks cetak", "Menghindari penggunaan media sosial dalam kehidupan sehari-hari"], correctAnswer: 1, explanation: "Literasi digital bukan sekadar kemampuan mengoperasikan perangkat teknologi, melainkan mencakup kemampuan mengakses, memahami, mengevaluasi secara kritis, dan menggunakan informasi secara etis dan bertanggung jawab di berbagai media digital." },
            { question: "Etika yang perlu diperhatikan dalam membaca dan berbagi informasi di media daring (online) adalah…", options: ["Menyebarkan informasi secepat mungkin tanpa perlu memverifikasi kebenaran informasi", "Memverifikasi kebenaran informasi sebelum menyebarkannya dan menghargai hak cipta konten digital", "Hanya membaca dan berbagi informasi yang bersumber dari media sosial populer", "Mengunduh dan mendistribusikan semua konten digital secara bebas"], correctAnswer: 1, explanation: "Etika dalam membaca dan berbagi informasi di media daring meliputi kewajiban memverifikasi kebenaran informasi (fact-checking) sebelum disebarkan dan menghormati hak cipta konten digital demi mencegah penyebaran hoaks dan pelanggaran hak kekayaan intelektual." },
            { question: "Membaca teknis adalah jenis membaca yang diterapkan pada teks-teks yang bersifat ilmiah atau teknis. Hakikat membaca teknis yang paling tepat adalah…", options: ["Membaca teks sastra dengan memperhatikan unsur intrinsik dan ekstrinsik", "Membaca teks yang mengandung istilah, simbol, dan konsep khusus bidang tertentu dengan tujuan memahami informasi faktual secara akurat", "Membaca teks secara cepat untuk memperoleh informasi umum dari berbagai bidang ilmu", "Membaca teks dengan cara bersuara agar lebih mudah dipahami"], correctAnswer: 1, explanation: "Membaca teknis adalah jenis membaca yang difokuskan pada teks ilmiah atau teknis yang mengandung istilah khusus, simbol, dan konsep dari bidang tertentu, dengan tujuan memahami informasi faktual secara akurat dan tepat sesuai konteks keilmuannya." },
            { question: "Membaca estetis berbeda dari jenis membaca lainnya karena menekankan pada…", options: ["Pemahaman fakta dan data yang terdapat dalam teks secara terperinci", "Kecepatan membaca untuk menyelesaikan bahan bacaan dalam jumlah banyak", "Penghayatan dan perasaan pembaca terhadap keindahan bahasa dan nilai estetika teks sastra", "Kemampuan menganalisis struktur kalimat dan tata bahasa dalam teks"], correctAnswer: 2, explanation: "Membaca estetis menekankan pada penghayatan, perasaan, dan apresiasi pembaca terhadap keindahan bahasa, nilai estetika, dan pengalaman imajinatif yang ditawarkan oleh teks sastra, berbeda dari membaca yang semata-mata bertujuan memperoleh informasi." },
            { question: "Menurut hakikat membaca, membaca merupakan suatu proses yang melibatkan kemampuan…", options: ["Menulis kembali isi bacaan dengan kata-kata sendiri", "Decoding (penerjemahan simbol) dan pemahaman makna secara bersamaan", "Menghafal seluruh isi teks yang dibaca", "Menyalin teks dari sumber aslinya"], correctAnswer: 1, explanation: "Membaca hakikatnya adalah proses decoding (mengurai lambang/simbol tulisan) sekaligus memahami makna yang terkandung di dalamnya, bukan sekadar menghafal atau menyalin." },
            { question: "Dalam tahap kegiatan membaca, kegiatan yang dilakukan sebelum seseorang mulai membaca teks disebut tahap…", options: ["Membaca intensif", "Prabaca", "Pascabaca", "Membaca literal"], correctAnswer: 1, explanation: "Tahap kegiatan membaca dibagi menjadi prabaca, saat baca, dan pascabaca. Prabaca adalah tahap persiapan sebelum membaca, seperti mengaktifkan pengetahuan awal dan menetapkan tujuan membaca." },
            { question: "Faktor internal yang memengaruhi kemampuan membaca seseorang di antaranya adalah…", options: ["Kualitas buku yang digunakan", "Kebisingan lingkungan sekitar", "Tingkat kecerdasan dan motivasi membaca", "Pencahayaan ruangan baca"], correctAnswer: 2, explanation: "Faktor internal adalah faktor yang berasal dari dalam diri pembaca, meliputi tingkat kecerdasan, minat, motivasi, dan kondisi fisik pembaca, bukan faktor yang berasal dari luar diri pembaca." },
            { question: "Berikut ini yang termasuk faktor eksternal yang memengaruhi kemampuan membaca adalah…", options: ["Kondisi kesehatan mata pembaca", "Minat dan bakat membaca", "Kenyamanan tempat membaca dan kualitas bahan bacaan", "Pengetahuan awal yang dimiliki pembaca"], correctAnswer: 2, explanation: "Faktor eksternal berasal dari luar diri pembaca, seperti kenyamanan tempat membaca, kualitas bahan bacaan, pencahayaan, dan dukungan lingkungan sekitar pembaca." },
            { question: "Salah satu cara mengatasi pengaruh buruk dalam membaca yang bersumber dari faktor internal adalah…", options: ["Memilih buku dengan font yang lebih besar", "Meningkatkan motivasi diri dan memperluas kosakata", "Mencari tempat membaca yang lebih tenang", "Mengurangi intensitas penggunaan media sosial"], correctAnswer: 1, explanation: "Untuk mengatasi hambatan membaca dari faktor internal seperti kurangnya motivasi atau keterbatasan kosakata, pembaca perlu aktif meningkatkan motivasi diri, memperkaya kosakata, dan melatih konsentrasi." },
            { question: "Pemahaman literal dalam membaca adalah kemampuan pembaca untuk…", options: ["Menyimpulkan makna tersirat di balik teks", "Memahami informasi yang secara eksplisit tersurat dalam teks", "Mengevaluasi kualitas penulisan sebuah teks", "Mengapresiasi keindahan bahasa dalam teks"], correctAnswer: 1, explanation: "Pemahaman literal adalah tingkat pemahaman paling dasar, yaitu kemampuan memahami informasi yang secara langsung dan jelas tersurat (tertulis) dalam teks tanpa perlu menafsirkan lebih lanjut." },
            { question: "Pemahaman interpretatif dalam membaca menuntut pembaca untuk mampu…", options: ["Membaca teks dengan suara keras dan jelas", "Menyalin kembali isi teks secara lengkap", "Menafsirkan makna yang tersirat dan menarik kesimpulan dari teks", "Mengidentifikasi ejaan dan tanda baca dalam teks"], correctAnswer: 2, explanation: "Pemahaman interpretatif berada di tingkat yang lebih tinggi dari literal; pembaca dituntut menafsirkan makna yang tidak langsung tersurat, menarik inferensi, dan menyimpulkan hal-hal yang tersirat dalam teks." },
            { question: "Membaca intensif didefinisikan sebagai kegiatan membaca yang…", options: ["Dilakukan dengan kecepatan tinggi untuk mendapatkan informasi umum", "Dilakukan secara cermat, teliti, dan mendalam untuk memahami teks secara menyeluruh", "Bertujuan untuk menikmati keindahan karya sastra", "Dilakukan secara sekilas untuk menemukan informasi tertentu"], correctAnswer: 1, explanation: "Membaca intensif adalah jenis membaca yang dilakukan secara cermat, teliti, dan mendalam dengan tujuan memahami isi teks secara komprehensif, termasuk detail-detail penting yang terkandung di dalamnya." },
            { question: "Strategi SQ3R merupakan salah satu strategi yang sering digunakan dalam membaca intensif. Huruf 'Q' dalam SQ3R singkatan dari…", options: ["Quick", "Question", "Qualify", "Query"], correctAnswer: 1, explanation: "SQ3R merupakan singkatan dari Survey, Question, Read, Recite, dan Review. Huruf 'Q' adalah singkatan dari Question, yaitu tahap membuat pertanyaan berdasarkan judul atau subjudul sebelum membaca teks secara penuh." },
            { question: "Membaca ekstensif berbeda dari membaca intensif karena membaca ekstensif…", options: ["Selalu dilakukan lebih lambat dan lebih teliti", "Dilakukan dalam jumlah bahan bacaan yang banyak dan bertujuan memperoleh gambaran umum", "Hanya berfokus pada teks sastra dan fiksi", "Menuntut pembaca menghafal seluruh isi bacaan"], correctAnswer: 1, explanation: "Membaca ekstensif dilakukan terhadap bahan bacaan dalam jumlah banyak dengan tujuan memperoleh pemahaman umum dan memperluas wawasan, berbeda dengan membaca intensif yang lebih mendalam dan terfokus pada satu teks." },
            { question: "Strategi membaca ekstensif yang digunakan untuk membaca sekilas guna mendapatkan gambaran umum isi teks disebut…", options: ["Scanning", "Intensive reading", "Skimming", "Critical reading"], correctAnswer: 2, explanation: "Skimming adalah teknik membaca sekilas untuk mendapatkan gambaran umum atau ide pokok teks, sedangkan scanning digunakan untuk mencari informasi atau fakta spesifik dalam teks." },
            { question: "Kecepatan membaca efektif diukur berdasarkan jumlah…", options: ["Paragraf yang dapat diselesaikan dalam satu jam", "Kata yang dibaca per menit (KPM) dikombinasikan dengan tingkat pemahaman", "Halaman yang dibaca tanpa henti", "Kalimat yang dapat dihafal setelah membaca"], correctAnswer: 1, explanation: "Kecepatan membaca efektif tidak hanya dilihat dari kuantitas kata per menit (KPM), tetapi juga dari tingkat pemahaman terhadap isi bacaan. Keduanya harus seimbang agar membaca menjadi efektif." },
            { question: "Salah satu teknik yang digunakan untuk melatih kecepatan membaca adalah…", options: ["Mengeja setiap kata satu per satu", "Membaca ulang setiap kalimat yang sudah dibaca", "Menghindari subvokalisasi dan melatih gerak mata secara teratur", "Membaca dengan suara keras setiap kata"], correctAnswer: 2, explanation: "Teknik melatih kecepatan membaca antara lain menghindari subvokalisasi (melafalkan kata dalam hati), melatih gerakan mata agar lebih luas jangkauannya, dan menghindari kebiasaan membaca ulang (regresi)." },
            { question: "Dalam konteks literasi digital, yang dimaksud dengan 'era disrupsi' adalah…", options: ["Masa ketika buku cetak tidak lagi diterbitkan", "Periode perubahan besar akibat teknologi digital yang mengubah pola kehidupan masyarakat secara mendasar", "Zaman ketika manusia mulai belajar membaca dan menulis", "Fase di mana pemerintah melarang penggunaan media sosial"], correctAnswer: 1, explanation: "Era disrupsi adalah periode di mana inovasi dan teknologi digital mengubah secara mendasar cara manusia bekerja, berkomunikasi, dan belajar, termasuk mengubah pola membaca dan literasi masyarakat." },
            { question: "Etika membaca di media daring (online) yang perlu diperhatikan antara lain adalah…", options: ["Membagikan semua informasi yang ditemukan tanpa verifikasi", "Memverifikasi kebenaran informasi sebelum membagikannya dan menghormati hak cipta", "Hanya membaca berita dari satu sumber terpercaya saja", "Menghindari penggunaan perangkat digital dalam membaca"], correctAnswer: 1, explanation: "Etika membaca di media daring mencakup kemampuan memverifikasi informasi (menghindari hoaks), menghormati hak cipta, dan menggunakan informasi secara bertanggung jawab sebelum disebarkan." },
            { question: "Membaca teknis adalah jenis membaca yang bertujuan untuk…", options: ["Menikmati keindahan dan nilai estetika sebuah karya sastra", "Memahami informasi yang bersifat teknis, ilmiah, atau prosedural secara akurat", "Membaca teks dengan kecepatan tinggi tanpa memperhatikan detail", "Memperoleh hiburan dari bacaan fiksi"], correctAnswer: 1, explanation: "Membaca teknis bertujuan untuk memahami informasi teknis, ilmiah, atau prosedural secara tepat dan akurat. Pembaca dituntut memahami istilah khusus, diagram, atau prosedur yang terdapat dalam teks." },
            { question: "Perbedaan utama antara membaca estetis dan membaca teknis terletak pada…", options: ["Kecepatan membaca yang digunakan", "Jumlah halaman teks yang dibaca", "Tujuan membaca; estetis untuk menikmati keindahan teks, teknis untuk memahami informasi faktual", "Jenis huruf dan format teks yang dibaca"], correctAnswer: 2, explanation: "Membaca estetis bertujuan untuk menghayati dan menikmati keindahan bahasa serta nilai-nilai dalam teks sastra, sedangkan membaca teknis bertujuan untuk memahami informasi faktual dan prosedural secara akurat dan tepat." },
            { question: "Membaca pada hakikatnya merupakan kegiatan yang melibatkan proses…", options: ["Hanya mengucapkan lambang-lambang tertulis dengan suara nyaring", "Mengolah dan memaknai informasi yang terdapat dalam teks secara aktif", "Menyalin tulisan dari satu media ke media lainnya", "Menghafal seluruh isi bacaan tanpa pemahaman mendalam"], correctAnswer: 1, explanation: "Hakikat membaca bukan sekadar mengucapkan lambang tertulis, melainkan proses aktif mengolah dan memaknai informasi yang terdapat dalam teks untuk membangun pemahaman." },
            { question: "Dalam tahap kegiatan membaca, tahap yang dilakukan sebelum pembaca memulai membaca teks secara keseluruhan disebut tahap…", options: ["Membaca intensif", "Prabaca", "Pascabaca", "Membaca nyaring"], correctAnswer: 1, explanation: "Tahap prabaca (pre-reading) adalah tahap yang dilakukan sebelum membaca, seperti mengaktifkan pengetahuan awal, melihat judul, dan memprediksi isi teks." },
            { question: "Faktor internal yang memengaruhi kemampuan membaca seseorang adalah…", options: ["Kondisi lingkungan fisik tempat membaca", "Kualitas bahan bacaan yang tersedia", "Motivasi, minat, dan kondisi fisik pembaca", "Ketersediaan perpustakaan di sekitar pembaca"], correctAnswer: 2, explanation: "Faktor internal adalah faktor yang berasal dari dalam diri pembaca, meliputi motivasi, minat baca, kondisi fisik, serta kemampuan kognitif pembaca itu sendiri." },
